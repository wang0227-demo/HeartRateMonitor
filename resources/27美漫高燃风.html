<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 纯美漫文字悬浮，无背景 */
        .container { 
            display: flex; align-items: center; 
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-style: italic;
        }

        /* 漫画式的浮夸缩放震颤 */
        @keyframes comic-shake {
            0% { transform: translate(0, 0) scale(1) rotate(-4deg); }
            50% { transform: translate(3px, -3px) scale(1.1) rotate(-2deg); }
            100% { transform: translate(0, 0) scale(1) rotate(-4deg); }
        }

        .heart { display: none; } /* 抛弃传统图标 */
        
        /* 浮夸的描边和黑影字 */
        #bpm { 
            font-size: 90px; min-width: 100px; text-align: center; font-weight: 900;
            color: #fff;
            -webkit-text-stroke: 3px #000;
            text-shadow: 6px 6px 0px #000;
            transform: rotate(-4deg);
            display: inline-block;
        }
        
        /* 动态拟声词气泡文字 */
        #onomatopoeia {
            font-size: 26px; font-weight: 900; margin-left: 15px; padding: 2px 10px;
            color: #ffff00; -webkit-text-stroke: 1.5px #000;
            text-shadow: 3px 3px 0px #000;
            transform: rotate(8deg);
            display: inline-block;
        }

        .max-info { display: flex; flex-direction: column; margin-left: 20px; transform: rotate(-2deg); }
        .max-label { font-size: 11px; color: #fff; -webkit-text-stroke: 1px #000; font-weight: bold; }
        #maxBpm { font-size: 26px; color: #ff9900; -webkit-text-stroke: 1.5px #000; text-shadow: 2px 2px 0 #000; font-weight: bold; }

        /* 状态微调：波普黄 -> 狂热橙 -> 爆炸红 */
        .status-normal #bpm { text-shadow: 6px 6px 0px #000; animation: comic-shake 0.8s infinite; }
        .status-normal #onomatopoeia { color: #00ffff; }

        .status-warning #bpm { color: #ffaa00; text-shadow: 6px 6px 0px #000; animation: comic-shake 0.4s infinite; }
        .status-warning #onomatopoeia { color: #ffff00; font-size: 30px; }

        .status-danger #bpm { color: #ff0033; text-shadow: 8px 8px 0px #000; animation: comic-shake 0.15s infinite; }
        .status-danger #onomatopoeia { color: #ff00cc; font-size: 38px; animation: comic-shake 0.1s infinite; }

        .disconnected { opacity: 0.2; }
        .disconnected #bpm { -webkit-text-stroke: 3px #444; text-shadow: none; color: #fff; animation: none !important; }
        .disconnected #onomatopoeia { display: none; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart"></span>
        <span id="bpm">--</span>
        <span id="onomatopoeia">*LUB-DUB*</span>
        <div class="max-info">
            <span class="max-label">PEAK!</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');
        const onoEl = document.getElementById('onomatopoeia');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        
                        // 动态改变拟声词内容
                        if (hr >= 120) { targetStatus = 'status-danger'; onoEl.innerText = '*THUMP!!!*'; }
                        else if (hr >= 100) { targetStatus = 'status-warning'; onoEl.innerText = '*PUMP!*'; }
                        else { targetStatus = 'status-normal'; onoEl.innerText = '*lub-dub*'; }
                        
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("???"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("REST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '--';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("ZZZ"); }, 1000);
        connect();
    </script>
</body>
</html>
