<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 宣纸背景与古典排版 */
        .container { 
            display: flex; align-items: center; 
            font-family: 'KaiTi', 'STKaiti', 'Baskerville', serif; /* 楷体优先 */
            background: rgba(244, 240, 230, 0.85); /* 宣纸色 */
            padding: 15px 30px;
            border: 1px solid #dcd3b2;
            border-radius: 2px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.1), inset 0 0 20px rgba(0,0,0,0.05);
            transition: all 0.8s ease;
        }

        /* 墨迹晕染跳动 */
        @keyframes ink-pulse { 
            0% { transform: scale(1) rotate(0deg); filter: blur(0px) opacity(0.8); } 
            50% { transform: scale(1.1) rotate(180deg); filter: blur(1px) opacity(1); } 
            100% { transform: scale(1) rotate(360deg); filter: blur(0px) opacity(0.8); } 
        }

        .heart { margin-right: 15px; font-size: 45px; display: inline-block; color: #333; }
        
        #bpm { font-size: 70px; min-width: 90px; text-align: center; color: #111; font-weight: bold; letter-spacing: -2px; }
        
        /* 印章风格的最高心率 */
        .max-info { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            margin-left: 20px; 
            border: 3px solid #b32d2d; border-radius: 4px; padding: 4px 8px;
            color: #b32d2d; transform: rotate(-3deg);
            opacity: 0.85;
        }
        .max-label { font-size: 12px; writing-mode: horizontal-tb; font-weight: bold; margin-bottom: 2px; border-bottom: 1px solid #b32d2d; padding-bottom: 2px; }
        #maxBpm { font-size: 22px; font-weight: bold; }

        /* 境界状态：清心 -> 动念 -> 走火入魔 */
        .status-normal .heart { animation: ink-pulse 2s infinite linear; }
        
        .status-warning { background: rgba(230, 215, 190, 0.9); }
        .status-warning .heart { animation: ink-pulse 0.8s infinite linear; color: #8b4513; }
        .status-warning #bpm { color: #5a2e0c; }

        /* 走火入魔：字体变红，剧烈抖动带重影 */
        @keyframes qi-deviation {
            0% { transform: translate(1px, 1px); text-shadow: -2px 0 red, 2px 0 black; }
            50% { transform: translate(-1px, -2px); text-shadow: 2px 0 red, -2px 0 black; }
            100% { transform: translate(1px, -1px); text-shadow: -2px 0 red, 2px 0 black; }
        }
        .status-danger { background: rgba(20, 5, 5, 0.9); border-color: #8a0000; box-shadow: 0 0 20px rgba(255,0,0,0.3); }
        .status-danger #bpm { color: #ff3333; animation: qi-deviation 0.1s infinite; }
        .status-danger .heart { animation: ink-pulse 0.3s infinite linear; filter: hue-rotate(150deg) brightness(2); color: red; }
        .status-danger .max-info { border-color: #ff0000; color: #ff0000; filter: drop-shadow(0 0 5px red); }

        .disconnected { opacity: 0.5; filter: grayscale(1); }
        .disconnected .heart { animation: none !important; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">☯</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">极境</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("断念"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("神游"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '无';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("闭关"); }, 1000);
        connect();
    </script>
</body>
</html>
