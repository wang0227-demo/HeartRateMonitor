<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        /* 使用等宽网格字体增强科技感 */
        .container { display: flex; align-items: center; font-family: 'Courier New', Courier, monospace; font-weight: 900; transition: all 0.3s ease; }
        .heart { will-change: transform, filter; margin-right: 25px; font-size: 50px; display: inline-block; }
        #bpm { font-size: 80px; min-width: 100px; text-align: center; letter-spacing: -2px; }
        
        .max-info { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; margin-left: 25px; border-left: 2px solid rgba(255,255,255,0.2); padding-left: 15px; }
        .max-label { font-size: 12px; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; font-weight: bold; margin-bottom: 2px; letter-spacing: 2px; }
        #maxBpm { font-size: 28px; color: rgba(255, 255, 255, 0.7); }

        /* 霓虹呼吸动画 */
        @keyframes neon-pulse { 
            0% { transform: scale(1); filter: drop-shadow(0 0 2px currentColor); } 
            50% { transform: scale(1.15); filter: drop-shadow(0 0 15px currentColor); } 
            100% { transform: scale(1); filter: drop-shadow(0 0 2px currentColor); } 
        }
        /* 故障抖动动画 */
        @keyframes glitch { 
            0% { transform: translate(0) } 
            20% { transform: translate(-2px, 2px) } 
            40% { transform: translate(-2px, -2px) } 
            60% { transform: translate(2px, 2px) } 
            80% { transform: translate(2px, -2px) } 
            100% { transform: translate(0) } 
        }

        /* 状态颜色：赛博霓虹色调 */
        .status-normal { color: #00f0ff; text-shadow: 0 0 10px #00f0ff, 0 0 20px rgba(0,240,255,0.3); }
        .status-normal .heart { animation: neon-pulse 0.8s infinite cubic-bezier(0.4, 0, 0.2, 1); }

        .status-warning { color: #ff007f; text-shadow: 0 0 10px #ff007f, 0 0 20px rgba(255,0,127,0.3); }
        .status-warning .heart { animation: neon-pulse 0.5s infinite linear; }

        .status-danger { color: #ffff00; text-shadow: 0 0 15px #ffff00, 0 0 30px rgba(255,255,0,0.5); }
        .status-danger .heart { animation: neon-pulse 0.25s infinite linear; }
        .status-danger #bpm { animation: glitch 0.3s infinite; }

        .disconnected { color: #333 !important; text-shadow: none !important; opacity: 0.5; }
        .disconnected .heart { animation: none !important; filter: grayscale(1); }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">🤖</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">Peak</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { 
                updateStateToDisconnected("LOST"); 
                setTimeout(connect, 5000); 
            };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
