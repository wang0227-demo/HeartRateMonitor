<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 终端控制台黑框 */
        .container { 
            display: inline-flex;
            flex-direction: column;
            background: #050706;
            border: 1px solid #1f3d24;
            padding: 12px 18px;
            font-family: 'Consolas', 'Courier New', monospace;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            width: 250px;
            box-sizing: border-box;
        }
        
        /* 终端首行控制栏 */
        .terminal-header {
            font-size: 9px;
            color: #387a41;
            margin-bottom: 8px;
            border-bottom: 1px solid #132416;
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* 核心代码日志流行为 */
        .log-line {
            font-size: 13px;
            color: #4af626;
            line-height: 1.4;
            white-space: nowrap;
        }
        
        /* 核心数值强化高亮 */
        .value-highlight {
            font-weight: bold;
            font-size: 16px;
            color: #ffffff;
            background: #132b16;
            padding: 0 4px;
        }
        
        /* 光标闪烁 */
        .cursor { animation: blink 0.8s infinite steps(2, start); }
        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

        /* 状态样式重写 */
        .status-normal .log-line { color: #4af626; }
        
        .status-warning { border-color: #5e4800; background: #0a0902; }
        .status-warning .terminal-header { color: #8a6c00; border-bottom-color: #2b2302; }
        .status-warning .log-line { color: #ffcc00; }
        .status-warning .value-highlight { background: #3d3000; color: #ffcc00; }
        
        .status-danger { border-color: #5e0013; background: #0c0204; animation: terminal-shake 0.2s infinite; }
        .status-danger .terminal-header { color: #a60024; border-bottom-color: #38020b; }
        .status-danger .log-line { color: #ff3355; }
        .status-danger .value-highlight { background: #4d0012; color: #ff3355; }
        
        @keyframes terminal-shake { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }

        /* 断开连接 */
        .disconnected { border-color: #222 !important; background: #090a0b !important; }
        .disconnected .terminal-header { color: #444; border-bottom-color: #1a1a1a; }
        .disconnected .log-line { color: #555 !important; }
        .disconnected .value-highlight { background: #222 !important; color: #555 !important; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <div class="terminal-header">
            <span>CORE_MONITOR v2.0</span>
            <span>ONLINE</span>
        </div>
        <div class="log-line">> STAT: <span id="logStat">DISCONN</span></div>
        <div class="log-line">> CORE_HR: <span id="bpm" class="value-highlight">--</span> bpm</div>
        <div class="log-line">> MAX_HR: <span id="maxBpm">--</span><span class="cursor">_</span></div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const logStatEl = document.getElementById('logStat');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        let statText = "RUNNING";
                        if (hr >= 120) { targetStatus = 'status-danger'; statText = "CRITICAL"; }
                        else if (hr >= 100) { targetStatus = 'status-warning'; statText = "WARNING"; }

                        logStatEl.innerText = statText;

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFFLINE");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST_WS"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = '--';
                maxEl.innerText = '--';
                logStatEl.innerText = text;
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("TIMEOUT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
