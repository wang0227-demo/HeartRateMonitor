<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 纯透明无边框战术HUD舞台 */
        .container { 
            display: inline-flex;
            align-items: center;
            font-family: 'Impact', monospace;
            background: transparent;
            padding: 10px 35px;
            position: relative;
        }

        /* 纯CSS绘制左右两道厚重的机械红黑固定卡爪 */
        .container::before, .container::after {
            content: ''; position: absolute; top: -2px; bottom: -2px; width: 12px;
            border-color: var(--hud-red, #ff0033); border-style: solid;
            filter: drop-shadow(0 0 4px rgba(255,0,50,0.4));
            transition: all 0.3s;
        }
        /* 左机械臂带有个性的顶部凸起 */
        .container::before { left: 0; border-width: 4px 0 4px 4px; }
        /* 右机械臂 */
        .container::after { right: 0; border-width: 4px 4px 4px 0; }
        
        /* 主数值 */
        #bpm { 
            font-size: 56px; font-weight: 900; 
            color: #ffffff; 
            text-shadow: 0 0 12px var(--hud-red, rgba(255,0,51,0.4)), 0 2px 4px #000;
            min-width: 90px; text-align: center; line-height: 0.9;
            font-style: italic;
        }
        
        /* 侧边堆叠的反应堆核心参数 */
        .core-panel { 
            display: flex; flex-direction: column; 
            margin-left: 18px; border-left: 1px dashed rgba(255, 0, 51, 0.3); padding-left: 14px;
        }
        
        /* 纯CSS绘制警告小三角 */
        .warning-tri {
            width: 0; height: 0; 
            border-left: 6px solid transparent; border-right: 6px solid transparent; 
            border-bottom: 10px solid var(--hud-red, #ff0033);
            margin-bottom: 5px;
            filter: drop-shadow(0 0 5px var(--hud-red, #ff0033));
        }

        #maxBpm { font-size: 18px; color: #ffffff; opacity: 0.9; font-weight: bold; font-style: italic; line-height: 1; }
        
        /* 反应堆过热核心脉冲膨胀 */
        @keyframes reactor-pulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.06); filter: brightness(1.3); }
        }

        /* 状态设置 */
        .status-normal { --hud-red: #ff0033; }
        
        .status-warning { --hud-red: #ff6600; }
        .status-warning::before, .status-warning::after { animation: reactor-pulse 0.8s infinite ease-in-out; }
        .status-warning #bpm { color: #ff6600; }
        
        .status-danger { --hud-red: #ff0000; }
        .status-danger::before, .status-danger::after { animation: reactor-pulse 0.25s infinite linear; border-width: 5px; }
        .status-danger #bpm { color: #ff0000; text-shadow: 0 0 20px #ff0000, 0 2px 4px #000; }

        /* 系统断开（核心离线，失去括号锁定） */
        .disconnected::before, .disconnected::after { border-color: #2a2c33 !important; border-width: 2px !important; animation: none !important; }
        .disconnected #bpm { color: #2a2c33; text-shadow: none; font-size: 36px; font-style: normal; }
        .disconnected .core-panel { border-left-color: #222; }
        .disconnected .warning-tri { border-bottom-color: #2a2c33; filter: none; }
        .disconnected #maxBpm { color: #2a2c33; font-style: normal; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="bpm">--</span>
        <div class="core-panel">
            <div class="warning-tri"></div>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
