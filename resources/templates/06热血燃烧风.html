<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        /* 使用粗壮厚实的字体 */
        .container { 
            display: flex; align-items: center; 
            font-family: 'Impact', 'Arial Black', sans-serif; font-style: italic;
            transition: all 0.2s;
        }
        .heart { margin-right: 15px; font-size: 55px; display: inline-block; transform-origin: bottom center; }
        #bpm { font-size: 90px; min-width: 100px; text-align: center; line-height: 1; }
        
        .max-info { display: flex; flex-direction: column; justify-content: center; margin-left: 20px; background: #111; padding: 5px 15px; transform: skewX(-10deg); border: 2px solid; }
        .max-label { font-size: 14px; text-transform: uppercase; margin-bottom: -5px; }
        #maxBpm { font-size: 36px; }

        /* 火焰跳动动画 */
        @keyframes fire-jump { 
            0%, 100% { transform: scaleY(1) rotate(0deg); } 
            50% { transform: scaleY(1.3) scaleX(0.9) rotate(-5deg); } 
        }
        /* 狂暴抖动 */
        @keyframes rage-shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            25% { transform: translate(-2px, -2px) rotate(-1deg); }
            50% { transform: translate(-2px, 2px) rotate(1deg); }
            75% { transform: translate(2px, -2px) rotate(0deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }

        /* 状态颜色：热身橙黄 -> 燃烧亮橙 -> 狂暴赤红 */
        .status-normal { color: #ffb84d; text-shadow: 2px 2px 0px #b36b00; }
        .status-normal .max-info { border-color: #ffb84d; color: #ffb84d; }
        .status-normal .heart { animation: fire-jump 0.8s infinite; filter: hue-rotate(30deg); }

        .status-warning { color: #ff6600; text-shadow: 3px 3px 0px #803300, 0 0 20px #ff6600; }
        .status-warning .max-info { border-color: #ff6600; color: #ff6600; }
        .status-warning .heart { animation: fire-jump 0.4s infinite; }

        .status-danger { color: #ff1a1a; text-shadow: 4px 4px 0px #660000, 0 0 30px #ff1a1a; animation: rage-shake 0.1s infinite; }
        .status-danger .max-info { border-color: #ff1a1a; color: #ff1a1a; }
        .status-danger .heart { animation: fire-jump 0.2s infinite; filter: hue-rotate(-20deg) brightness(1.2); }

        .disconnected { color: #444 !important; text-shadow: none !important; }
        .disconnected .max-info { border-color: #333; color: #444; }
        .disconnected .heart { animation: none !important; filter: grayscale(1); opacity: 0.5; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">🔥</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">PEAK</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';
        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("OFF"); }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text; maxEl.innerText = '--';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
