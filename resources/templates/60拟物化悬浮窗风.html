<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 流体果冻液滴外壳 */
        .container { 
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 24px;
            border-radius: 100px; /* 极度圆润 */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        
        /* 模拟发光的核心液态质感圆点 */
        .heart { 
            width: 12px; height: 12px; border-radius: 50%; margin-right: 16px;
            background: var(--fluid-color, #007aff);
            box-shadow: 0 0 15px var(--fluid-color, #007aff);
            transition: background 0.3s;
        }
        
        /* 无衬线大单色数字 */
        #bpm { 
            font-size: 44px; font-weight: 300; color: #ffffff; 
            min-width: 70px; text-align: center; letter-spacing: -1px;
        }
        
        /* 最右侧悬浮轻巧的最高值 */
        .max-info { 
            display: flex; flex-direction: column; align-items: flex-start; margin-left: 15px;
        }
        .max-label { font-size: 8px; color: rgba(255, 255, 255, 0.3); font-weight: bold; letter-spacing: 0.5px; }
        #maxBpm { font-size: 16px; color: rgba(255, 255, 255, 0.6); font-weight: 400; }
        
        /* 果冻液滴弹跳动画 */
        @keyframes fluid-bounce {
            0%, 100% { border-radius: 100px; transform: scale(1); }
            35% { border-radius: 90px 110px 95px 105px; transform: scale(1.03, 0.97); }
            70% { border-radius: 105px 95px 105px 90px; transform: scale(0.98, 1.02); }
        }

        /* 状态设置 */
        .status-normal { --fluid-color: #00ffff; animation: fluid-bounce 1.2s infinite ease-in-out; }
        
        .status-warning { --fluid-color: #ff9500; animation: fluid-bounce 0.7s infinite ease-in-out; background: rgba(255,149,0,0.08); }
        .status-warning #bpm { font-weight: 400; }

        .status-danger { --fluid-color: #ff2d55; animation: fluid-bounce 0.4s infinite ease-in-out; background: rgba(255,45,85,0.15); border-color: rgba(255,45,85,0.3); }
        .status-danger #bpm { font-weight: 600; color: #ff2d55; }

        /* 断开连接 */
        .disconnected { background: rgba(255, 255, 255, 0.03) !important; border-color: rgba(255,255,255,0.05) !important; box-shadow: none !important; animation: none !important;}
        .disconnected .heart { background: #444 !important; box-shadow: none !important; }
        .disconnected #bpm { color: rgba(255,255,255,0.2); font-size: 28px; }
        .disconnected #maxBpm { color: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart"></span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">PEAK</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
