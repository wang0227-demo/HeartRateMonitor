<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 漫画边框与波普圆点背景 */
        .container { 
            display: flex; align-items: center; 
            font-family: 'Comic Sans MS', 'Impact', sans-serif;
            background-color: #fff;
            /* 波普半色调背景图案 */
            background-image: radial-gradient(#aaa 15%, transparent 16%), radial-gradient(#aaa 15%, transparent 16%);
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
            border: 4px solid #000;
            border-radius: 10px;
            padding: 10px 20px;
            box-shadow: 6px 6px 0px #000; /* 漫画风硬阴影 */
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .heart { margin-right: 15px; font-size: 55px; display: inline-block; filter: drop-shadow(2px 2px 0px #000); }
        
        /* 粗黑描边字体 */
        #bpm { 
            font-size: 80px; min-width: 90px; text-align: center; font-weight: 900;
            -webkit-text-stroke: 3px #000; color: #fff;
            text-shadow: 4px 4px 0px #000;
        }
        
        .max-info { 
            display: flex; flex-direction: column; align-items: flex-start; margin-left: 20px; 
            background: #fff; border: 3px solid #000; padding: 2px 10px; transform: rotate(5deg); box-shadow: 3px 3px 0px #000;
        }
        .max-label { font-size: 12px; font-weight: 900; color: #000; }
        #maxBpm { font-size: 26px; font-weight: 900; -webkit-text-stroke: 1px #000; color: #fff; }

        /* 漫画风爆炸跳动 */
        @keyframes comic-pow { 
            0% { transform: scale(1) rotate(0deg); } 
            20% { transform: scale(1.4) rotate(-10deg); } 
            40% { transform: scale(0.9) rotate(5deg); } 
            100% { transform: scale(1) rotate(0deg); } 
        }

        /* 状态切换：通过底色和文字颜色的剧烈撞色表现 */
        .status-normal { background-color: #00e5ff; }
        .status-normal #bpm { color: #fff; }
        .status-normal .max-info { background: #fff; }
        .status-normal #maxBpm { color: #00e5ff; }
        .status-normal .heart { animation: comic-pow 1s infinite; }

        .status-warning { background-color: #ffff00; }
        .status-warning #bpm { color: #ff00ff; -webkit-text-stroke: 3px #000; }
        .status-warning #maxBpm { color: #ff00ff; }
        .status-warning .heart { animation: comic-pow 0.5s infinite; }

        .status-danger { background-color: #ff0000; }
        .status-danger #bpm { color: #ffff00; text-shadow: 6px 6px 0px #000; }
        .status-danger .max-info { transform: rotate(-5deg); background: #ffff00; }
        .status-danger #maxBpm { color: #ff0000; }
        .status-danger .heart { animation: comic-pow 0.25s infinite; }

        .disconnected { background-color: #ccc; box-shadow: 0 0 0 #000; transform: scale(0.95); }
        .disconnected #bpm, .disconnected #maxBpm { color: #777; -webkit-text-stroke: 0px; text-shadow: none; }
        .disconnected .heart { animation: none !important; filter: grayscale(1); }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">💥</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">PEAK!</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("OFF"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '--';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("WAIT"); }, 1000);
        connect();
    </script>
</body>
</html>
