<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 电视机屏幕，叠加扫描线 */
        .container { 
            display: flex; align-items: baseline; 
            font-family: 'Courier New', monospace; font-weight: bold;
            background: #050a05; 
            padding: 10px 25px;
            border: 2px solid #1a331a;
            position: relative;
            /* 物理扫描线网格滤镜效果 */
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            box-shadow: inset 0 0 20px rgba(0,0,0,1), 0 0 10px rgba(0, 255, 0, 0.2);
            transition: all 0.3s;
        }

        .heart { margin-right: 15px; font-size: 35px; display: inline-block; color: #39ff14; }
        
        /* 荧光绿字符 */
        #bpm { font-size: 70px; min-width: 90px; text-align: center; color: #39ff14; text-shadow: 0 0 8px rgba(57, 255, 20, 0.6); }
        
        .max-info { display: flex; flex-direction: column; align-items: flex-end; margin-left: 20px; border-left: 1px dashed #1a331a; padding-left: 15px; font-size: 12px; color: #1a331a; }
        .max-label { letter-spacing: 1px; }
        #maxBpm { font-size: 22px; color: #2bbd10; }

        /* 正常状态下：信号微弱抖动 */
        @keyframes crt-twitch {
            0%, 100% { transform: skewX(0deg); opacity: 1; }
            95% { transform: skewX(0deg); opacity: 1; }
            96% { transform: skewX(4deg); opacity: 0.8; }
            97% { transform: skewX(-4deg); opacity: 0.9; }
            98% { transform: skewX(0deg); opacity: 0.5; }
        }
        .status-normal { animation: crt-twitch 3s infinite; }

        /* 警告状态：信号开始变差，色调泛黄 */
        .status-warning { background: #0f0f00; border-color: #333300; }
        .status-warning #bpm, .status-warning .heart { color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.6); }
        .status-warning { animation: crt-twitch 1s infinite; }

        /* 致命危险：信号彻底崩溃！画面撕裂错位，文字变血红并疯狂闪烁 */
        @keyframes vhs-glitch {
            0% { transform: translate(0, 0) scaleY(1); filter: hue-rotate(0deg); }
            10% { transform: translate(-3px, 2px) scaleY(1.05); }
            20% { transform: translate(3px, -1px) skewX(10deg); }
            30% { transform: translate(0, 0) scaleY(0.9); filter: contrast(2); }
            90% { transform: translate(1px, -2px); }
            100% { transform: translate(0, 0); }
        }
        .status-danger { background: #1a0000; border-color: #550000; animation: vhs-glitch 0.15s infinite; }
        .status-danger #bpm, .status-danger .heart { color: #ff0033; text-shadow: 0 0 15px #ff0033, 0 0 30px #550000; }
        .status-danger .max-info { color: #550000; }
        .status-danger #maxBpm { color: #ff0033; }

        .disconnected { opacity: 0.3; filter: grayscale(1); background: #000; border-color: #111; }
        .disconnected #bpm { color: #333; text-shadow: none; }
        .disconnected .heart { animation: none !important; color: #333; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">👁️</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">LMT_HR</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("ERR"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = 'N/A';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("STBY"); }, 1000);
        connect();
    </script>
</body>
</html>
