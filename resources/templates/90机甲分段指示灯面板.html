<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>心率 - 机甲分段面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background: transparent; padding:30px;}
.mecha-box{
  width: 300px;
  height: 100px;
  background: #1e1e1e;
  border: 1px solid #333;
  border-left: 6px solid #444;
  padding: 15px 25px;
  display: flex;
  align-items: center;
  gap: 25px;
  box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
}
.light-group{
  display: flex;
  gap: 6px;
}
.light{
  width: 14px;
  height: 40px;
  background: #222;
  border-radius: 2px;
}
#bpm{
  font-size: 52px;
  font-family: monospace;
  flex: 1;
}
.desc{color:#777;font-size:12px;}
/* 状态灯光+文字 */
.status-normal .light{background:#2ecc71;animation: breathe 2s infinite;}
.status-normal #bpm{color:#2ecc71;}
.status-warning .light{background:#f39c12;animation: breathe 1s infinite;}
.status-warning #bpm{color:#f39c12;}
.status-danger .light{background:#e74c3c;animation: flash 0.4s infinite;}
.status-danger #bpm{color:#e74c3c;}
.disconnected .light{background:#333;animation:none;}
.disconnected #bpm{color:#555;}
@keyframes breathe{
  0%,100%{opacity:0.5}
  50%{opacity:1}
}
@keyframes flash{
  0%,100%{opacity:1}
  50%{opacity:0.2}
}
</style>
</head>
<body>
<div id="wrap" class="mecha-box disconnected">
  <div class="light-group">
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
  </div>
  <div>
    <div id="bpm">--</div>
    <div class="desc">峰值心率：<span id="maxBpm">--</span></div>
  </div>
</div>

<script>
let socket, lastTime = Date.now(), status = 'disconnected';
const bpm = document.getElementById('bpm');
const maxBpm = document.getElementById('maxBpm');
const wrap = document.getElementById('wrap');

function connect(){
  if(socket && [0,1].includes(socket.readyState)) return;
  socket = new WebSocket('ws://127.0.0.1:8001');
  socket.onmessage = e => {
    try{
      const d = JSON.parse(e.data);
      lastTime = Date.now();
      if(d.connected && d.heart_rate > 0){
        bpm.innerText = d.heart_rate;
        maxBpm.innerText = d.max_heart_rate || '--';
        let st = 'status-normal';
        if(d.heart_rate >= 120) st = 'status-danger';
        else if(d.heart_rate >= 100) st = 'status-warning';
        wrap.className = 'mecha-box ' + st;
        status = st;
      }else{
        wrap.className = 'mecha-box disconnected';
        bpm.innerText = 'NO DATA';
        maxBpm.innerText = '--';
        status = 'disconnected';
      }
    }catch(err){}
  };
  socket.onclose = () => {
    wrap.className = 'mecha-box disconnected';
    bpm.innerText = 'LOST';
    setTimeout(connect, 5000);
  };
}
setInterval(()=>{
  if(status !== 'disconnected' && Date.now() - lastTime > 4000){
    wrap.className = 'mecha-box disconnected';
    bpm.innerText = 'WAIT';
    status = 'disconnected';
  }
},1000);
connect();
</script>
</body>
</html>
