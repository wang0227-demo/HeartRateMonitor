<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent;  overflow: hidden; margin: 0; padding: 20px; }
        
        /* 全息投影容器 */
        .container { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 150, 200, 0.2) 0%, rgba(0, 50, 100, 0.1) 100%);
            border: 1px solid rgba(0, 200, 255, 0.6);
            position: relative;
            box-sizing: border-box;
            box-shadow: 0 0 25px rgba(0, 200, 255, 0.4), inset 0 0 20px rgba(0, 150, 200, 0.3);
            transition: all 0.3s linear;
        }

        /* 全息网格边框 */
        .container::before {
            content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 50%; 
            background: repeating-conic-gradient(rgba(0, 200, 255, 0.1) 0deg, rgba(0, 200, 255, 0.1) 10deg, transparent 10deg, transparent 20deg);
            opacity: 0.7;
            transition: transform 1s linear;
        }
        
        /* 心率主数值（全息发光） */
        #bpm { 
            font-size: 44px; font-weight: 300; 
            color: #00e5ff;
            text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff, 0 0 30px #00e5ff;
            line-height: 1; margin-top: 15px;
        }
        
        /* 顶部峰值锁定 */
        .max-info { position: absolute; top: 18px; text-align: center; }
        .max-label { font-size: 9px; color: rgba(0, 200, 255, 0.4); display: block; }
        #maxBpm { font-size: 14px; color: #ffffff; opacity: 0.9; font-weight: 400; text-shadow: 0 0 5px #00e5ff; }
        
        /* 底部标签 */
        .hud-tag { position: absolute; bottom: 18px; font-size: 9px; color: rgba(0, 200, 255, 0.7); letter-spacing: 1px; }

        /* 动画定义 */
        @keyframes hud-rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes alert-flicker { 0%, 100% { opacity: 0.7; box-shadow: 0 0 20px rgba(0, 200, 255, 0.3), inset 0 0 15px rgba(0, 150, 200, 0.2); } 50% { opacity: 1; box-shadow: 0 0 30px rgba(255, 50, 50, 0.6), inset 0 0 20px rgba(255, 50, 50, 0.4); } }

        /* 状态映射 */
        .status-normal::before { animation: hud-rotate 18s infinite linear; }
        
        .status-warning { border-color: rgba(255, 200, 0, 0.7); box-shadow: 0 0 25px rgba(255, 200, 0, 0.5), inset 0 0 20px rgba(255, 200, 0, 0.3); }
        .status-warning::before { background: repeating-conic-gradient(rgba(255, 200, 0, 0.1) 0deg, rgba(255, 200, 0, 0.1) 10deg, transparent 10deg, transparent 20deg); animation: hud-rotate 8s infinite linear; }
        .status-warning #bpm { color: #ffdd00; text-shadow: 0 0 10px #ffdd00, 0 0 20px #ffdd00; }
        .status-warning .hud-tag { color: rgba(255, 200, 0, 0.8); }
        
        .status-danger { border-color: rgba(255, 50, 50, 0.8); animation: alert-flicker 0.4s infinite; }
        .status-danger::before { background: repeating-conic-gradient(rgba(255, 50, 50, 0.15) 0deg, rgba(255, 50, 50, 0.15) 10deg, transparent 10deg, transparent 20deg); animation: hud-rotate 3s infinite linear; opacity: 1; }
        .status-danger #bpm { color: #ff3366; text-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366; }
        .status-danger .hud-tag { color: rgba(255, 50, 50, 0.9); }

        /* 断开连接 */
        .disconnected { border: 1px solid #333 !important; background: rgba(10,10,20,0.2) !important; box-shadow: none !important; }
        .disconnected::before { display: none; }
        .disconnected #bpm { color: #444; text-shadow: none; font-size: 28px; }
        .disconnected #maxBpm { color: #444; }
        .disconnected .max-label { color: #222; }
        .disconnected .hud-tag { color: #444; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <div class="max-info">
            <span class="max-label">PEAK_LOCK</span>
            <span id="maxBpm">--</span>
        </div>
        <span id="bpm">--</span>
        <span class="hud-tag">HOLO_HR_SYSTEM</span>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
