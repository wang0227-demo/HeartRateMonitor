<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 极其浅淡的毛玻璃微胶囊 */
        .container { 
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 6px 18px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            position: relative;
        }
        
        /* 主文本 */
        #bpm { 
            font-size: 34px; font-weight: bold; color: rgba(255,255,255,0.9); 
            line-height: 1; min-width: 60px; text-align: center;
        }
        
        /* 右侧轻量工业分线及小标签 */
        .meta-panel { 
            display: flex; flex-direction: column; margin-left: 14px;
            border-left: 1px solid rgba(255,255,255,0.1); padding-left: 12px; line-height: 1.1;
        }
        .lbl { font-size: 7px; color: rgba(255,255,255,0.3); font-weight: bold; text-transform: uppercase; }
        #maxBpm { font-size: 14px; color: rgba(255,255,255,0.6); font-weight: bold; margin-top: 2px; }

        /* 极简过载发热脉冲 */
        @keyframes soft-pulse {
            0% { border-color: rgba(255, 0, 50, 0.2); background: rgba(255, 0, 50, 0.02); }
            100% { border-color: rgba(255, 0, 50, 0.5); background: rgba(255, 0, 50, 0.06); box-shadow: 0 0 10px rgba(255, 0, 50, 0.1); }
        }

        /* 状态设置 */
        .status-normal {}
        
        .status-warning { border-color: rgba(255,170,0,0.3); }
        .status-warning #bpm { color: #ffaa00; }

        .status-danger { animation: soft-pulse 0.5s infinite alternate ease-in-out; }
        .status-danger #bpm { color: #ff0033; }
        .status-danger #maxBpm { color: rgba(255,0,51,0.8); }

        /* 断开连接 */
        .disconnected { background: transparent !important; border-color: rgba(255,255,255,0.03) !important; box-shadow: none !important; backdrop-filter: none !important; }
        .disconnected #bpm { color: rgba(255,255,255,0.08); font-size: 24px; }
        .disconnected .meta-panel { border-left-color: rgba(255,255,255,0.03); }
        .disconnected #maxBpm { color: rgba(255,255,255,0.05); }
        .disconnected .lbl { color: rgba(255,255,255,0.02); }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="bpm">--</span>
        <div class="meta-panel">
            <span class="lbl">pk_val</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
