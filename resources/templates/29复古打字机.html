<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 纯机械打字机文本悬浮 */
        .container { 
            display: flex; align-items: baseline; 
            font-family: 'Courier New', Courier, monospace; 
            font-weight: bold;
            color: #2b2b2b; /* 经典打字机复古黑墨色 */
            transition: color 0.3s ease;
        }

        /* 模仿打字机字模撞击纸张的顿挫动效 */
        @keyframes type-strike {
            0% { transform: scale(1) translateY(0); opacity: 0.9; }
            10% { transform: scale(1.15) translateY(-2px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 0.9; }
        }

        .heart { font-size: 28px; margin-right: 15px; animation: type-strike 1s infinite steps(4); display: inline-block; }
        
        /* 打字机纯字 */
        #bpm { font-size: 75px; min-width: 90px; text-align: center; font-weight: bold; }
        
        /* 机械色带拨片符号 */
        .ribbon-pin { font-size: 30px; margin-left: 10px; display: inline-block; transition: all 0.1s; }

        .max-info { display: flex; flex-direction: column; margin-left: 25px; font-size: 12px; font-style: italic; }
        .max-label { opacity: 0.5; }
        #maxBpm { font-size: 22px; margin-top: 2px; text-decoration: underline; }

        /* 状态微调：纸张油墨由黑色 -> 警戒深蓝 -> 彻底红字 */
        /* Normal: 纯黑墨 */
        .status-normal { color: #1a1a1a; }
        .status-normal .heart { animation: type-strike 1s infinite ease-in-out; }

        /* Warning: 复古深蓝墨 */
        .status-warning { color: #003366; }
        .status-warning .heart { animation: type-strike 0.5s infinite ease-in-out; }
        .status-warning .ribbon-pin { transform: translateX(3px); }

        /* Danger: 经典的打字机双色色带“切红字”模式，高频剧烈砸纸 */
        .status-danger { color: #b22222; }
        .status-danger .heart { animation: type-strike 0.22s infinite alternate; }
        .status-danger .ribbon-pin { animation: type-strike 0.11s infinite alternate; color: #ff0000; }

        .disconnected { color: #999 !important; }
        .disconnected .heart, .disconnected .ribbon-pin { animation: none !important; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">♥</span>
        <span id="bpm">--</span>
        <span class="ribbon-pin">◀</span>
        <div class="max-info">
            <span class="max-label">HISTORIC_HI</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("---"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '---';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("END"); }, 1000);
        connect();
    </script>
</body>
</html>
