<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #000; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 赛博朋克核心容器 */
        .container { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 10, 20, 0.8), rgba(30, 0, 50, 0.8));
            border: 2px solid #00ffff;
            position: relative;
            box-sizing: border-box;
            box-shadow: 0 0 15px #00ffff, inset 0 0 10px #ff00ff;
            transition: all 0.3s linear;
        }

        /* 赛博朋克机械边框 */
        .container::before {
            content: ''; position: absolute; top: -8px; left: -8px; right: -8px; bottom: -8px;
            border-radius: 50%; 
            border: 2px dashed #ff00ff;
            clip-path: polygon(40% 0, 60% 0, 60% 100%, 40% 100%, 0 60%, 0 40%, 100% 40%, 100% 60%);
            opacity: 0.7;
            transition: transform 1s linear;
        }
        
        /* 心率主数值 */
        #bpm { 
            font-size: 42px; font-weight: 900; 
            color: #00ffff;
            text-shadow: 0 0 8px #00ffff, 0 0 15px #00ffff;
            line-height: 1; margin-top: 15px;
            letter-spacing: 2px;
        }
        
        /* 顶部峰值锁定 */
        .max-info { position: absolute; top: 15px; text-align: center; }
        .max-label { font-size: 9px; color: rgba(255, 0, 255, 0.5); display: block; text-transform: uppercase; }
        #maxBpm { font-size: 14px; color: #ffffff; opacity: 0.9; font-weight: bold; text-shadow: 0 0 5px #ff00ff; }
        
        /* 底部标签 */
        .hud-tag { position: absolute; bottom: 15px; font-size: 9px; color: #00ffff; letter-spacing: 2px; text-transform: uppercase; }

        /* 动画定义 */
        @keyframes hud-rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes alert-flicker { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; box-shadow: 0 0 20px #ff3300, inset 0 0 15px #ff3300; } }

        /* 状态映射 */
        .status-normal::before { animation: hud-rotate 12s infinite linear; }
        
        .status-warning { --warning-color: #ffcc00; border-color: #ffcc00; box-shadow: 0 0 15px #ffcc00, inset 0 0 10px #ffcc00; }
        .status-warning::before { border-color: #ffcc00; animation: hud-rotate 6s infinite linear; }
        .status-warning #bpm { color: #ffcc00; text-shadow: 0 0 8px #ffcc00; }
        .status-warning .hud-tag { color: #ffcc00; }
        
        .status-danger { --danger-color: #ff3300; border-color: #ff3300; box-shadow: 0 0 20px #ff3300, inset 0 0 15px #ff3300; animation: alert-flicker 0.3s infinite; }
        .status-danger::before { border-color: #ff3300; animation: hud-rotate 2s infinite linear; opacity: 1; }
        .status-danger #bpm { color: #ff3300; text-shadow: 0 0 8px #ff3300; }
        .status-danger .hud-tag { color: #ff3300; }

        /* 断开连接 */
        .disconnected { border: 2px solid #333 !important; background: rgba(10,10,10,0.4) !important; box-shadow: none !important; }
        .disconnected::before { display: none; }
        .disconnected #bpm { color: #444; text-shadow: none; font-size: 28px; }
        .disconnected #maxBpm { color: #444; }
        .disconnected .max-label { color: #222; }
        .disconnected .hud-tag { color: #444; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <div class="max-info">
            <span class="max-label">PEAK_LOCK</span>
            <span id="maxBpm">--</span>
        </div>
        <span id="bpm">--</span>
        <span class="hud-tag">SYS_HR_CYBER</span>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
