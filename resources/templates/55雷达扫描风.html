<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 纯圆形雷达声纳舱 */
        .container { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(10, 12, 18, 0.8);
            border: 2px solid var(--theme-color, #00e5ff);
            position: relative;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
            transition: all 0.4s ease;
        }
        
        /* 最高值挪至圆形最上方 */
        .max-info { position: absolute; top: 18px; text-align: center; }
        .max-label { font-size: 8px; color: rgba(255,255,255,0.3); font-weight: bold; letter-spacing: 1px; }
        #maxBpm { font-size: 14px; color: rgba(255,255,255,0.7); font-weight: bold; }
        
        /* 核心心率大字 */
        #bpm { 
            font-size: 40px; font-weight: bold; 
            color: var(--theme-color, #00e5ff);
            text-shadow: 0 0 10px var(--theme-color, #00e5ff);
            margin-top: 15px;
        }
        
        /* 底部中心小圆点代替爱心 */
        .heart { position: absolute; bottom: 20px; font-size: 10px; color: var(--theme-color, #00e5ff); }
        
        /* 声纳往外扩散的光圈涟漪 */
        .container::before, .container::after {
            content: ''; position: absolute; 
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%; border: 2px solid var(--theme-color, #00e5ff);
            opacity: 0; will-change: transform, opacity;
            z-index: -1;
        }
        
        @keyframes sonar-wave {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* 状态判定与速度自适应 */
        .status-normal { --theme-color: #00e5ff; }
        .status-normal::before { animation: sonar-wave 1.2s infinite cubic-bezier(0.1, 0.8, 0.3, 1); }
        .status-normal::after { animation: sonar-wave 1.2s infinite cubic-bezier(0.1, 0.8, 0.3, 1); animation-delay: 0.6s; }
        
        .status-warning { --theme-color: #ffaa00; box-shadow: 0 0 25px rgba(255,170,0,0.25); }
        .status-warning::before { animation: sonar-wave 0.7s infinite linear; }
        
        .status-danger { --theme-color: #ff0055; box-shadow: 0 0 35px rgba(255,0,85,0.4); }
        .status-danger::before { animation: sonar-wave 0.35s infinite linear; }
        .status-danger #bpm { animation: pulse 0.35s infinite alternate; }
        
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }

        /* 断开连接 */
        .disconnected { --theme-color: #444 !important; box-shadow: none !important; background: rgba(20,20,20,0.6) !important; }
        .disconnected::before, .disconnected::after { animation: none !important; }
        .disconnected #bpm { color: #555; font-size: 26px; text-shadow: none; }
        .disconnected #maxBpm { color: #444; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <div class="max-info">
            <span class="max-label">PEAK</span>
            <span id="maxBpm">--</span>
        </div>
        <span id="bpm">--</span>
        <span id="heartIcon" class="heart">▲</span>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
