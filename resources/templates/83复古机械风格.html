<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent;  overflow: hidden; margin: 0; padding: 20px; }
        
        /* 复古机械容器 */
        .container { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #2d2d2d;
            border: 3px solid #8b7d6b;
            position: relative;
            box-sizing: border-box;
            box-shadow: inset 0 0 10px #111, 0 0 8px rgba(0,0,0,0.8);
            transition: all 0.3s linear;
        }

        /* 复古金属边框 */
        .container::before {
            content: ''; position: absolute; top: -6px; left: -6px; right: -6px; bottom: -6px;
            border-radius: 50%; 
            border: 2px solid #a6937c;
            opacity: 0.5;
            transition: transform 1s linear;
            background: linear-gradient(45deg, transparent 30%, #8b7d6b 50%, transparent 70%);
        }
        
        /* 心率主数值（模拟机械表盘数字） */
        #bpm { 
            font-size: 38px; font-weight: 900; 
            color: #e8d7b9;
            text-shadow: 0 1px 2px #000;
            line-height: 1; margin-top: 10px;
            letter-spacing: 1px;
        }
        
        /* 顶部峰值锁定 */
        .max-info { position: absolute; top: 12px; text-align: center; }
        .max-label { font-size: 8px; color: #8b7d6b; display: block; text-transform: uppercase; }
        #maxBpm { font-size: 13px; color: #e8d7b9; opacity: 0.9; font-weight: bold; text-shadow: 0 1px 1px #000; }
        
        /* 底部标签 */
        .hud-tag { position: absolute; bottom: 12px; font-size: 8px; color: #8b7d6b; letter-spacing: 1px; text-transform: uppercase; }

        /* 动画定义 */
        @keyframes hud-rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes alert-flicker { 0%, 100% { opacity: 0.8; background: #2d2d2d; } 50% { opacity: 1; background: #402020; } }

        /* 状态映射 */
        .status-normal::before { animation: hud-rotate 20s infinite linear; }
        
        .status-warning { border-color: #d4a017; }
        .status-warning::before { border-color: #d4a017; animation: hud-rotate 10s infinite linear; opacity: 0.7; }
        .status-warning #bpm { color: #f0c860; }
        .status-warning .hud-tag { color: #d4a017; }
        
        .status-danger { border-color: #a52a2a; animation: alert-flicker 0.5s infinite; }
        .status-danger::before { border-color: #a52a2a; animation: hud-rotate 4s infinite linear; opacity: 1; }
        .status-danger #bpm { color: #e64040; }
        .status-danger .hud-tag { color: #a52a2a; }

        /* 断开连接 */
        .disconnected { border: 3px solid #444 !important; background: #222 !important; box-shadow: none !important; }
        .disconnected::before { display: none; }
        .disconnected #bpm { color: #555; text-shadow: none; font-size: 26px; }
        .disconnected #maxBpm { color: #555; }
        .disconnected .max-label { color: #333; }
        .disconnected .hud-tag { color: #555; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <div class="max-info">
            <span class="max-label">PEAK_LOCK</span>
            <span id="maxBpm">--</span>
        </div>
        <span id="bpm">--</span>
        <span class="hud-tag">SYS_HR_VINTAGE</span>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
