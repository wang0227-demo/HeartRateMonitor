<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>心率-长条状态栏</title>
<style>
body { background: transparent;  margin: 0; padding: 20px; }
.hr-bar {
  display: inline-flex;
  align-items: center;
  width: 200px;
  height: 60px;
  background: #2b2b2b;
  border: 1px solid #444;
  border-radius: 6px;
  padding: 0 20px;
  gap: 20px;
  font-family: monospace;
  transition: all 0.3s;
}
.label { color: #aaa; font-size: 14px; }
#bpm { font-size: 32px; font-weight: bold; flex: 1; }
.max { color: #888; font-size: 13px; }
/* 状态色 */
.status-normal #bpm { color: #4cd964; }
.status-warning #bpm { color: #ffcc00; }
.status-danger #bpm { color: #ff3b30; }
.disconnected { background: #1e1e1e; border-color: #333; }
.disconnected #bpm { color: #555; }
</style>
</head>
<body>
<div id="wrap" class="hr-bar disconnected">
  <span class="label">心率 BPM</span>
  <span id="bpm">--</span>
  <span class="max">峰值: <span id="maxBpm">--</span></span>
</div>

<script>
let socket, lastTime = Date.now(), status = 'disconnected';
const bpm = document.getElementById('bpm');
const maxBpm = document.getElementById('maxBpm');
const wrap = document.getElementById('wrap');

function conn() {
  if(socket && [0,1].includes(socket.readyState)) return;
  socket = new WebSocket('ws://127.0.0.1:8001');
  socket.onmessage = e => {
    try{
      let d = JSON.parse(e.data);
      lastTime = Date.now();
      if(d.connected && d.heart_rate > 0){
        bpm.innerText = d.heart_rate;
        maxBpm.innerText = d.max_heart_rate || '--';
        let st = 'status-normal';
        if(d.heart_rate >= 120) st = 'status-danger';
        else if(d.heart_rate >= 100) st = 'status-warning';
        wrap.className = 'hr-bar ' + st;
        status = st;
      }else{
        wrap.className = 'hr-bar disconnected';
        bpm.innerText = '离线';
        maxBpm.innerText = '--';
        status = 'disconnected';
      }
    }catch(err){}
  };
  socket.onclose = () => {
    wrap.className = 'hr-bar disconnected';
    bpm.innerText = '断连';
    setTimeout(conn, 5000);
  };
}
setInterval(()=>{
  if(status !== 'disconnected' && Date.now() - lastTime > 4000){
    wrap.className = 'hr-bar disconnected';
    bpm.innerText = '等待';
    status = 'disconnected';
  }
},1000);
conn();
</script>
</body>
</html>
