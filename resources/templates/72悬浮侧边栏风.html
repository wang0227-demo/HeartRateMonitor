<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 极窄纵向侧边签 */
        .container { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 60px;
            height: 140px;
            background: #ffffff;
            border-radius: 16px;
            padding: 14px 0;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: all 0.4s ease;
        }
        
        /* 顶部非常低调的占位小点代替图标 */
        .heart { 
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--tag-color, #007ff7);
        }
        
        /* 核心心率大字（大字居中，保持高清晰度） */
        #bpm { 
            font-size: 28px; font-weight: 800; color: #1d1d1f; 
            line-height: 1; text-align: center;
        }
        
        /* 底部最高值小字组合 */
        .max-info { text-align: center; }
        .max-label { font-size: 8px; color: #86868b; font-weight: bold; display: block; scale: 0.85; }
        #maxBpm { font-size: 13px; color: #1d1d1f; font-weight: 600; margin-top: 1px; }
        
        /* 优雅的缓动呼吸 */
        @keyframes border-glow {
            0%, 100% { box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
            50% { box-shadow: 0 10px 30px var(--glow-color); }
        }

        /* 状态判定 */
        .status-normal { --tag-color: #34c759; }
        
        .status-warning { --tag-color: #ff9500; --glow-color: rgba(255,149,0,0.2); animation: border-glow 1s infinite; }
        .status-warning #bpm { color: #ff9500; }
        
        .status-danger { --tag-color: #ff3b30; --glow-color: rgba(255,59,48,0.3); animation: border-glow 0.4s infinite; background: #fff2f1; }
        .status-danger #bpm { color: #ff3b30; }

        /* 断开连接 */
        .disconnected { background: #f5f5f7 !important; box-shadow: none !important; animation: none !important; }
        .disconnected .heart { background: #d1d1d6 !important; }
        .disconnected #bpm { color: #aeaeae; font-size: 20px; }
        .disconnected #maxBpm { color: #aeaeae; }
        .disconnected .max-label { color: #e5e5ea; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart"></span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">MAX</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
