<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 诅咒档案粗黑边框 */
        .container { 
            display: inline-flex;
            align-items: center;
            background: #000000;
            border: 3px solid #ffffff;
            padding: 6px 20px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            position: relative;
            box-shadow: 5px 5px 0px #ff0000;
        }
        
        /* 狂暴大数字 */
        #bpm { 
            font-size: 50px; font-weight: 900; 
            color: #ffffff; line-height: 1;
            min-width: 85px; text-align: center;
            letter-spacing: -1px;
        }
        
        /* 右侧垂直粗线与副极限 */
        .retro-side {
            display: flex; flex-direction: column; margin-left: 16px;
            border-left: 2px solid #ffffff; padding-left: 14px; line-height: 1;
        }
        .retro-lbl { font-size: 9px; color: #888888; font-weight: bold; font-family: Arial, sans-serif; letter-spacing: 0.5px; }
        #maxBpm { font-size: 20px; color: #ffffff; font-weight: bold; margin-top: 4px; }

        /* 极端危机：惊悚狂颤 */
        @keyframes horror-shiver {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 1px); }
            50% { transform: translate(1px, -2px); }
            75% { transform: translate(-1px, -1px); }
            100% { transform: translate(2px, 2px); }
        }

        /* 状态分支 */
        .status-normal {}
        
        .status-warning { border-color: #ffaa00; box-shadow: 5px 5px 0px #ffaa00; }
        .status-warning #bpm { color: #ffaa00; }

        .status-danger { 
            border-color: #ff0000; 
            box-shadow: 7px 7px 0px #880000;
            animation: horror-shiver 0.15s infinite linear;
        }
        .status-danger #bpm { color: #ff0000; }
        .status-danger .retro-side { border-left-color: #ff0000; }
        .status-danger #maxBpm { color: #ff0000; }

        /* 系统沦陷断开 */
        .disconnected { border-color: #222 !important; box-shadow: none !important; background: #050505 !important; }
        .disconnected #bpm { color: #222; font-size: 32px; letter-spacing: 0; }
        .disconnected .retro-side { border-left-color: #222; }
        .disconnected #maxBpm { color: #222; }
        .disconnected .retro-lbl { color: #151515; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="bpm">--</span>
        <div class="retro-side">
            <span class="retro-lbl">MAX_DEAD</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
