<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 潮流毛玻璃容器 */
        .container { 
            display: flex; 
            align-items: center; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 12px 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* 渐变流光呼吸灯圈 */
        .heart { 
            width: 18px;
            height: 18px;
            border-radius: 50%;
            margin-right: 25px; 
            display: inline-block; 
            will-change: transform, box-shadow;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
        }
        
        /* 主字体采用加粗现代斜体，更有动感 */
        #bpm { 
            font-size: 56px; 
            font-weight: 900; 
            font-style: italic;
            min-width: 90px; 
            text-align: center;
            background: linear-gradient(135deg, #ffffff 30%, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* 最高值展示 */
        .max-info { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            margin-left: 25px; 
            padding-left: 20px;
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        .max-label { font-size: 10px; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; font-weight: 800; letter-spacing: 1.5px; }
        #maxBpm { font-size: 24px; font-weight: 700; color: rgba(255, 255, 255, 0.9); margin-top: 2px; }
        
        /* 丝滑的流光呼吸动画 */
        @keyframes neon-glow {
            0% { transform: scale(1); box-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color); }
            50% { transform: scale(1.3); box-shadow: 0 0 20px var(--glow-color), 0 0 40px var(--glow-color); }
            100% { transform: scale(1); box-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color); }
        }
        
        /* 状态 1：正常（极光青蓝渐变） */
        .status-normal { --glow-color: rgba(0, 242, 254, 0.6); border-color: rgba(0, 242, 254, 0.3); }
        .status-normal .heart { background: linear-gradient(45deg, #00f2fe, #4facfe); animation: neon-glow 1.0s infinite ease-in-out; }
        
        /* 状态 2：警告（日落金橙渐变） */
        .status-warning { --glow-color: rgba(255, 107, 107, 0.6); border-color: rgba(255, 107, 107, 0.3); }
        .status-warning .heart { background: linear-gradient(45deg, #ff9a9e, #fecfef); animation: neon-glow 0.6s infinite ease-in-out; }
        .status-warning #bpm { background: linear-gradient(135deg, #ff9a9e, #fecfef); -webkit-background-clip: text; }
        
        /* 状态 3：危险（熔岩狂暴红渐变） */
        .status-danger { --glow-color: rgba(255, 0, 128, 0.8); border-color: rgba(255, 0, 128, 0.5); background: rgba(35, 10, 20, 0.7); }
        .status-danger .heart { background: linear-gradient(45deg, #ff007f, #ff0033); animation: neon-glow 0.3s infinite ease-in-out; }
        .status-danger #bpm { background: linear-gradient(135deg, #ff007f, #ff0033); -webkit-background-clip: text; }

        /* 断开连接 */
        .disconnected { border-color: rgba(255,255,255,0.05) !important; background: rgba(20, 20, 25, 0.4) !important; backdrop-filter: none !important; }
        .disconnected .heart { background: #44444f !important; box-shadow: none !important; animation: none !important; }
        .disconnected #bpm { background: #55555f; -webkit-background-clip: text; }
        .disconnected #maxBpm { color: #55555f; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart"></span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">PEAK VAL</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { 
                updateStateToDisconnected("LOST"); 
                setTimeout(connect, 5000); 
            };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
