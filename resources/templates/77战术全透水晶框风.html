<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 绝对全透舞台 */
        .container { 
            display: inline-flex;
            align-items: flex-end;
            background: transparent;
            padding: 12px 18px;
            position: relative;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        /* 纯CSS精细绘制四角透明战术包边 */
        .container::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid var(--anchor-color, rgba(255,255,255,0.25));
            clip-path: polygon(
                0 0, 10px 0, 10px 1px, 1px 1px, 1px 10px, 0 10px,
                100% 0, calc(100% - 10px) 0, calc(100% - 10px) 1px, calc(100% - 1px) 1px, calc(100% - 1px) 10px, 100% 10px,
                100% 100%, calc(100% - 10px) 100%, calc(100% - 10px) calc(100% - 1px), calc(100% - 1px) calc(100% - 1px), calc(100% - 1px) calc(100% - 10px), 100% calc(100% - 10px),
                0 100%, 10px 100%, 10px calc(100% - 1px), 1px calc(100% - 1px), 1px calc(100% - 10px), 0 calc(100% - 10px)
            );
            transition: border-color 0.3s;
        }
        
        /* 数据布局 */
        #bpm { 
            font-size: 42px; font-weight: bold; color: #ffffff; line-height: 1;
            min-width: 70px; text-align: left;
        }
        
        .tac-meta { display: flex; flex-direction: column; align-items: flex-end; margin-left: 14px; line-height: 1; }
        .tac-lbl { font-size: 7px; color: rgba(255,255,255,0.25); font-weight: bold; transform: scale(0.9); }
        #maxBpm { font-size: 16px; color: var(--anchor-color, rgba(255,255,255,0.6)); font-weight: bold; margin-top: 3px; }
        
        /* 危险状态高频红闪 */
        @keyframes tac-alert {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; filter: drop-shadow(0 0 3px #ff3300); }
        }

        /* 状态设置 */
        .status-normal { --anchor-color: rgba(255,255,255,0.4); }
        
        .status-warning { --anchor-color: #ffaa00; }
        .status-warning #bpm { color: #ffaa00; }

        .status-danger { --anchor-color: #ff3300; }
        .status-danger #bpm { color: #ff3300; }
        .status-danger::before { animation: tac-alert 0.4s infinite ease-in-out; }

        /* 系统断开连接 */
        .disconnected::before { border-color: rgba(255,255,255,0.04) !important; animation: none !important; }
        .disconnected #bpm { color: rgba(255,255,255,0.06); font-size: 26px; }
        .disconnected #maxBpm { color: rgba(255,255,255,0.04); }
        .disconnected .tac-lbl { color: rgba(255,255,255,0.02); }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="bpm">--</span>
        <div class="tac-meta">
            <span class="tac-lbl">MAX_STAT</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
