<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 视网膜生化义体外框 */
        .container { 
            display: flex;
            flex-direction: column;
            width: 180px;
            background: rgba(12, 11, 20, 0.85);
            border-left: 4px solid var(--bar-color, #00f0ff);
            padding: 8px 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            font-family: 'Arial Black', -apple-system, sans-serif;
            position: relative;
        }

        /* 顶部数据层 */
        .hud-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 6px; }
        
        #bpm { 
            font-size: 40px; font-weight: 900; color: #ffffff; line-height: 1;
            letter-spacing: -0.5px; font-style: italic;
        }
        
        .hud-meta { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
        .hud-lbl { font-size: 7px; color: #4b4a61; font-weight: bold; font-family: Arial, sans-serif; letter-spacing: 0.5px; }
        #maxBpm { font-size: 16px; color: var(--bar-color, #00f0ff); font-weight: bold; font-style: italic; }
        
        /* 底部义体过载能量网格条 */
        .hud-bar-container {
            width: 100%; height: 4px; background: #171624; position: relative;
        }
        .hud-bar-fill {
            height: 100%; width: 60%; background: var(--bar-color, #00f0ff);
            box-shadow: 0 0 8px var(--bar-color, #00f0ff);
            transition: all 0.4s ease;
        }

        /* 生化核心暴走波动 */
        @keyframes cyber-pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.25) drop-shadow(0 0 5px var(--bar-color)); }
        }

        /* 状态映射 */
        .status-normal { --bar-color: #00f0ff; }
        .status-normal .hud-bar-fill { width: 55%; }
        
        .status-warning { --bar-color: #ff00ff; }
        .status-warning #bpm { color: #ff00ff; }
        .status-warning .hud-bar-fill { width: 80%; }

        .status-danger { --bar-color: #ff3300; animation: cyber-pulse 0.3s infinite; }
        .status-danger #bpm { color: #ff3300; }
        .status-danger .hud-bar-fill { width: 100%; }

        /* 断开连接（系统休眠死机） */
        .disconnected { border-left-color: #222 !important; background: #0b0a0f !important; box-shadow: none !important; }
        .disconnected #bpm { color: #262533; font-size: 26px; font-style: normal; }
        .disconnected #maxBpm { color: #262533; font-style: normal; }
        .disconnected .hud-bar-fill { width: 0% !important; box-shadow: none !important; }
        .disconnected .hud-lbl { color: #1c1b26; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <div class="hud-top">
            <span id="bpm">--</span>
            <div class="hud-meta">
                <span class="hud-lbl">SYS_MAX_PULSE</span>
                <span id="maxBpm">--</span>
            </div>
        </div>
        <div class="hud-bar-container">
            <div class="hud-bar-fill"></div>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
