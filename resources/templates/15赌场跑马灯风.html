<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 赌场招牌基底 */
        .container { 
            display: flex; align-items: center; justify-content: center;
            font-family: 'Arial Black', Impact, sans-serif;
            background: linear-gradient(180deg, #3a0000 0%, #1a0000 100%);
            padding: 15px 25px;
            border-radius: 10px;
            /* 跑马灯圆点边框模拟 */
            border: 8px dotted #ffcc00;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4), inset 0 0 15px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        /* 跑马灯流动闪烁动效 */
        @keyframes marquee-lights {
            0% { border-color: #ffcc00; }
            50% { border-color: #fff; filter: drop-shadow(0 0 10px #ffcc00); }
            100% { border-color: #ffcc00; }
        }

        .heart { margin-right: 15px; font-size: 50px; display: inline-block; filter: drop-shadow(0 0 10px #ff0000); }
        
        /* 浮夸的拉霸机数字 */
        #bpm { 
            font-size: 80px; min-width: 110px; text-align: center; 
            color: #fff;
            text-shadow: 0 5px 0 #cccccc, 0 8px 15px rgba(0,0,0,0.8); /* 3D 立体字效果 */
        }
        
        .max-info { display: flex; flex-direction: column; align-items: center; margin-left: 20px; background: #000; border: 2px solid #ffcc00; border-radius: 5px; padding: 5px 10px; }
        .max-label { font-size: 12px; color: #ffcc00; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        #maxBpm { font-size: 26px; color: #ff0000; font-weight: 900; }

        /* 筹码投币跳动 */
        @keyframes coin-jump { 
            0% { transform: translateY(0); } 
            50% { transform: translateY(-10px) rotate(10deg); } 
            100% { transform: translateY(0); } 
        }

        /* 正常状态：缓慢闪烁 */
        .status-normal { animation: marquee-lights 1s infinite step-start; }
        .status-normal .heart { animation: coin-jump 0.8s infinite; }

        /* 警告状态：加快，变红黄交替 */
        .status-warning { background: linear-gradient(180deg, #660000 0%, #330000 100%); animation: marquee-lights 0.2s infinite step-start; }
        .status-warning #bpm { color: #ffcc00; text-shadow: 0 5px 0 #b38f00, 0 0 20px #ffcc00; }
        .status-warning .heart { animation: coin-jump 0.4s infinite; }

        /* 中奖状态（高心率）：七彩霓虹爆闪 JACKPOT */
        @keyframes jackpot-flash {
            0% { border-color: #ff0000; box-shadow: 0 0 50px #ff0000; }
            33% { border-color: #00ff00; box-shadow: 0 0 50px #00ff00; }
            66% { border-color: #0000ff; box-shadow: 0 0 50px #0000ff; }
            100% { border-color: #ff00ff; box-shadow: 0 0 50px #ff00ff; }
        }
        .status-danger { animation: jackpot-flash 0.1s infinite; background: #fff; }
        .status-danger #bpm { color: #ff0000; text-shadow: 0 5px 0 #990000, 0 0 30px #ff0000; transform: scale(1.1); }
        .status-danger .max-info { background: #ffcc00; border-color: #ff0000; }
        .status-danger .max-label { color: #ff0000; }
        .status-danger .heart { animation: coin-jump 0.15s infinite; transform: scale(1.3); }

        .disconnected { animation: none; border-color: #444; filter: grayscale(1); opacity: 0.8; }
        .disconnected .heart { animation: none !important; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">🎰</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">JACKPOT</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("CASH OUT"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("EMPTY"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '00';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("SPIN..."); }, 1000);
        connect();
    </script>
</body>
</html>
