<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 重金属摇滚风格 */
        .container { 
            display: flex; align-items: center; 
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }

        /* 地狱熔岩燃烧动画 */
        @keyframes hell-pulse { 
            0% { transform: scale(1); filter: brightness(1); } 
            50% { transform: scale(1.15) rotate(-3deg); filter: brightness(1.4); } 
            100% { transform: scale(1); filter: brightness(1); } 
        }

        .heart { margin-right: 15px; font-size: 50px; display: inline-block; filter: drop-shadow(0 0 10px #ff3300); }
        
        /* 利用层叠阴影手工雕刻的火焰燃烧效果 */
        #bpm { 
            font-size: 85px; min-width: 95px; text-align: center; font-weight: 900; italic;
            color: #fff;
            /* 基础暗火层 */
            text-shadow: 
                0 0 4px #fff, 
                0 -4px 10px #ffcc00, 
                2px -8px 15px #ff5500, 
                -2px -15px 25px #ff0000;
        }
        
        .max-info { display: flex; flex-direction: column; align-items: center; margin-left: 20px; border-bottom: 2px solid #ff3300; padding-bottom: 5px; }
        .max-label { font-size: 12px; color: #ff5500; font-weight: bold; letter-spacing: 2px; }
        #maxBpm { font-size: 28px; color: #ffcc00; text-shadow: 0 0 5px #ff5500; }

        /* 状态控制：随着心率升高，火焰从微弱变成太阳耀斑爆燃 */
        /* Normal状态：正常的暗红碳火 */
        .status-normal .heart { animation: hell-pulse 1s infinite ease-in-out; }
        
        /* Warning状态：黄金爆燃 */
        .status-warning #bpm {
            text-shadow: 0 0 4px #fff, 0 -6px 12px #ffeb3b, 0 -15px 25px #ff9800, 0 -25px 40px #ff3d00;
        }
        .status-warning .heart { animation: hell-pulse 0.4s infinite ease-in-out; filter: drop-shadow(0 0 15px #ff9800); }

        /* Danger状态：火山毁灭爆燃！画面附带高频愤怒震颤 */
        @keyframes hell-rage {
            0% { transform: translate(0, 0) scale(1.05); }
            50% { transform: translate(2px, -2px) scale(1.1); }
            100% { transform: translate(-2px, 1px) scale(1.05); }
        }
        .status-danger #bpm {
            color: #ffffcc;
            text-shadow: 0 0 6px #fff, 0 -10px 20px #fff, 0 -20px 35px #ff0055, 0 -35px 60px #ff0000;
            animation: hell-rage 0.1s infinite;
        }
        .status-danger .heart { animation: hell-rage 0.15s infinite; font-size: 55px; filter: drop-shadow(0 0 25px #ff0000) invert(0.1); }
        .status-danger #maxBpm { color: #fff; text-shadow: 0 0 10px #ff0000; }

        .disconnected { opacity: 0.3; filter: grayscale(1); }
        .disconnected #bpm { text-shadow: none !important; color: #666; }
        .disconnected .heart { animation: none !important; filter: none; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">💀</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">WRATH</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("EXT"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("COLD"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '000';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("ASH"); }, 1000);
        connect();
    </script>
</body>
</html>
