<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 双拼不规则容器 */
        .container { 
            display: inline-flex;
            align-items: flex-end;
            font-family: 'Arial Black', sans-serif;
            background: transparent;
        }
        
        /* 左侧主数值大挂牌 */
        .main-tag {
            background: #11141a;
            border-left: 5px solid var(--neon-color, #00f0ff);
            padding: 8px 18px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .heart { font-size: 28px; margin-right: 12px; color: var(--neon-color, #00f0ff); }
        #bpm { font-size: 42px; font-weight: 900; color: #ffffff; line-height: 1; }
        
        /* 右侧交错拼接的最高值副挂牌 */
        .max-tag {
            background: #1c2029;
            padding: 6px 14px;
            font-size: 11px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
            margin-left: -2px; /* 产生黏连感 */
            margin-bottom: -4px; /* 垂直错落 */
            border-top: 3px solid #3a4150;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }
        .max-label { font-size: 8px; color: #5a657d; font-weight: bold; letter-spacing: 0.5px; }
        #maxBpm { font-size: 16px; color: #a2b4db; font-weight: bold; margin-top: 1px; }
        
        /* 霓虹警报交替闪动动画 */
        @keyframes neon-pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3) drop-shadow(0 0 8px var(--neon-color)); }
        }

        /* 状态样式 */
        .status-normal { --neon-color: #00f0ff; }
        
        .status-warning { --neon-color: #ff00ff; }
        .status-warning .main-tag { border-left-color: #ff00ff; }
        
        .status-danger { --neon-color: #ff3b30; animation: neon-pulse 0.3s infinite ease-in-out; }
        .status-danger .main-tag { border-left-color: #ff3b30; background: #25080b; }
        .status-danger .max-tag { border-top-color: #ff3b30; background: #1c0507; }

        /* 断开连接 */
        .disconnected .main-tag { background: #1a1a1a !important; border-left-color: #444 !important; box-shadow: none !important;}
        .disconnected .max-tag { background: #151515 !important; border-top-color: #333 !important; box-shadow: none !important;}
        .disconnected .heart { color: #333; }
        .disconnected #bpm { color: #444; font-size: 28px; }
        .disconnected #maxBpm { color: #333; }
        .disconnected .max-label { color: #222; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <div class="main-tag">
            <span id="heartIcon" class="heart">⚡</span>
            <span id="bpm">--</span>
        </div>
        <div class="max-tag">
            <span class="max-label">LIMIT</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
