<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 环形圆弧舞台 */
        .container { 
            display: inline-flex;
            align-items: center;
            background: transparent;
            padding: 10px;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            position: relative;
        }

        /* 纯 CSS 绘制的半圆仪表环外圈 */
        .gauge-arc {
            width: 55px; height: 55px;
            border: 2px solid var(--gauge-color, rgba(255,255,255,0.15));
            border-left-color: transparent; border-bottom-color: transparent;
            border-radius: 50%;
            transform: rotate(-45deg);
            position: relative;
            margin-right: 18px;
            transition: border-color 0.4s;
        }
        
        /* 内圈环形点 */
        .gauge-arc::after {
            content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px dashed var(--gauge-color, rgba(255,255,255,0.15));
            border-radius: 50%;
        }

        /* 旋转流光动画 */
        @keyframes gauge-spin {
            0% { transform: rotate(-45deg); }
            100% { transform: rotate(315deg); }
        }
        
        /* 居中错位数字排版 */
        .hud-center { display: flex; flex-direction: column; line-height: 0.9; }
        .hud-lbl { font-size: 8px; color: rgba(255,255,255,0.3); font-weight: bold; letter-spacing: 1px; }
        #bpm { 
            font-size: 42px; font-weight: 800; color: #ffffff; 
            letter-spacing: -0.5px;
        }
        
        /* 顶端独立悬浮的最高值 */
        .peak-node {
            position: absolute; left: 52px; top: 6px;
            display: flex; flex-direction: column; line-height: 1;
        }
        .peak-lbl { font-size: 6px; color: rgba(255,255,255,0.25); transform: scale(0.8); }
        #maxBpm { font-size: 13px; color: var(--gauge-color, rgba(255,255,255,0.6)); font-weight: bold; }

        /* 状态变色树 */
        .status-normal { --gauge-color: #00e5ff; }
        
        .status-warning { --gauge-color: #ffaa00; }
        .status-warning #bpm { color: #ffaa00; }

        .status-danger { --gauge-color: #ff0055; }
        .status-danger #bpm { color: #ff0055; }
        /* 危机时圆弧开启狂暴过载旋转扫描 */
        .status-danger .gauge-arc { animation: gauge-spin 0.6s infinite linear; }

        /* 系统断开（表盘损毁） */
        .disconnected .gauge-arc { border-color: rgba(255,255,255,0.03) !important; animation: none !important; }
        .disconnected .gauge-arc::after { border-style: none; }
        .disconnected #bpm { color: rgba(255,255,255,0.06); font-size: 26px; }
        .disconnected #maxBpm { color: rgba(255,255,255,0.03); }
        .disconnected .hud-lbl, .disconnected .peak-lbl { color: transparent; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <div class="gauge-arc"></div>
        <div class="peak-node">
            <span class="peak-lbl">MAX</span>
            <span id="maxBpm">--</span>
        </div>
        <div class="hud-center">
            <span class="hud-lbl">RATE</span>
            <span id="bpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
