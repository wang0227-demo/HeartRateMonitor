<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 拟物化高光晶体 */
        .container { 
            display: flex; align-items: center; 
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            border-radius: 50px; /* 胶囊形状 */
            padding: 10px 30px;
            position: relative;
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.2), 
                inset 0 -5px 15px rgba(0,0,0,0.2), 
                inset 0 5px 15px rgba(255,255,255,0.7); /* 内发光制造立体感 */
            transition: all 0.5s ease;
        }
        /* 玻璃顶部的反光层 */
        .container::before {
            content: ''; position: absolute; top: 2px; left: 10px; right: 10px; height: 35%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 100%);
            border-radius: 50px 50px 100px 100px; pointer-events: none;
        }

        .heart { margin-right: 15px; font-size: 45px; display: inline-block; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2)); }
        
        #bpm { font-size: 70px; min-width: 90px; text-align: center; font-weight: bold; color: white; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        .max-info { display: flex; flex-direction: column; align-items: center; margin-left: 20px; }
        .max-label { font-size: 11px; font-weight: bold; color: rgba(255,255,255,0.8); text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        #maxBpm { font-size: 24px; color: white; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }

        /* 水泡浮动缩放动效 */
        @keyframes bubble-float { 
            0% { transform: translateY(0px) scale(1); } 
            50% { transform: translateY(-3px) scale(1.1); } 
            100% { transform: translateY(0px) scale(1); } 
        }

        /* 鲜艳清透的色彩 */
        .status-normal { background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); border: 1px solid #4fc3f7; }
        .status-normal .heart { animation: bubble-float 1.2s infinite ease-in-out; }

        .status-warning { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); border: 1px solid #ffd54f; }
        .status-warning .heart { animation: bubble-float 0.6s infinite ease-in-out; }

        .status-danger { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); border: 1px solid #ff5252; }
        .status-danger .heart { animation: bubble-float 0.3s infinite ease-in-out; }

        .disconnected { background: linear-gradient(135deg, #e0e0e0 0%, #bdbdbd 100%); box-shadow: none; border: 1px solid #ccc; opacity: 0.6; }
        .disconnected .heart { animation: none !important; filter: grayscale(1) opacity(0.5); }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">🫧</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">PEAK</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("OFF"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '--';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("WAIT"); }, 1000);
        connect();
    </script>
</body>
</html>
