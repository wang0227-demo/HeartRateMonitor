<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 极光无框舞台 */
        .container { 
            display: inline-flex;
            align-items: center;
            background: transparent;
            padding: 8px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            position: relative;
        }

        /* 左侧呼吸霓虹环 */
        .neon-ring {
            width: 12px; height: 12px; border-radius: 50%;
            border: 2px solid var(--ring-color, #00ffcc);
            box-shadow: 0 0 10px var(--ring-color, #00ffcc), inset 0 0 6px var(--ring-color, #00ffcc);
            margin-right: 15px;
            position: relative;
        }
        
        /* 光环呼吸扩散粒子波 */
        .neon-ring::after {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%; border: 1px solid var(--ring-color, #00ffcc);
            animation: ring-wave 1.2s infinite ease-out;
        }

        @keyframes ring-wave {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.4); opacity: 0; filter: blur(1px); }
        }
        
        /* 纤细优雅的极光字 */
        #bpm { 
            font-size: 42px; font-weight: 200; 
            color: #ffffff; line-height: 1;
            min-width: 70px; text-align: left;
            letter-spacing: -1px;
            text-shadow: 0 0 8px var(--ring-color, #00ffcc);
        }
        
        .max-box { display: flex; flex-direction: column; margin-left: 14px; line-height: 1.1;}
        .max-lbl { font-size: 7px; color: rgba(255,255,255,0.3); font-weight: bold; letter-spacing: 0.5px; }
        #maxBpm { font-size: 16px; color: rgba(255,255,255,0.6); font-weight: 300; margin-top: 2px; }
        
        /* 状态驱动 */
        .status-normal { --ring-color: #00ffcc; }
        
        .status-warning { --ring-color: #ff00ff; }
        .status-warning #bpm { font-weight: 300; text-shadow: 0 0 8px #ff00ff; }
        .status-warning .neon-ring::after { animation-duration: 0.7s; }

        .status-danger { --ring-color: #ff3300; }
        .status-danger #bpm { font-weight: 400; text-shadow: 0 0 12px #ff3300; color: #ff3300; }
        .status-danger .neon-ring::after { animation-duration: 0.35s; border-width: 2px; }

        /* 系统断开连接 */
        .disconnected .neon-ring { border-color: #25272e !important; box-shadow: none !important; }
        .disconnected .neon-ring::after { animation: none !important; }
        .disconnected #bpm { color: rgba(255,255,255,0.15); text-shadow: none !important; font-size: 26px; font-weight: 300; }
        .disconnected #maxBpm { color: rgba(255,255,255,0.08); }
        .disconnected .max-lbl { color: rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <div class="neon-ring"></div>
        <span id="bpm">--</span>
        <div class="max-box">
            <span class="max-lbl">PEAK_VAL</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
