<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>心率-像素风格</title>
<style>
body { margin: 0; padding: 20px; background: transparent; }
.hr-pixel {
  width: 180px;
  height: 150px;
  background: #111;
  border: 4px solid #0f0;
  padding: 10px;
  box-sizing: border-box;
  font-family: "Courier New", monospace;
}
#bpm {
  font-size: 48px;
  color: #0f0;
  margin: 20px 0;
}
.tip { color: #8f8; font-size: 12px; }
/* 状态切换 */
.status-normal { border-color: #0f0; }
.status-warning { border-color: #ff0; }
.status-warning #bpm { color: #ff0; }
.status-danger { border-color: #f00; }
.status-danger #bpm { color: #f00; }
.disconnected { border-color: #444; }
.disconnected #bpm { color: #444; }
</style>
</head>
<body>
<div id="wrap" class="hr-pixel disconnected">
  <div class="tip">HEART RATE</div>
  <div id="bpm">--</div>
  <div class="tip">MAX: <span id="maxBpm">--</span></div>
</div>

<script>
let socket, lastTime = Date.now(), status = 'disconnected';
const bpm = document.getElementById('bpm');
const maxBpm = document.getElementById('maxBpm');
const wrap = document.getElementById('wrap');

function conn() {
  if(socket && [0,1].includes(socket.readyState)) return;
  socket = new WebSocket('ws://127.0.0.1:8001');
  socket.onmessage = e => {
    try{
      let d = JSON.parse(e.data);
      lastTime = Date.now();
      if(d.connected && d.heart_rate > 0){
        bpm.innerText = d.heart_rate;
        maxBpm.innerText = d.max_heart_rate || '--';
        let st = 'status-normal';
        if(d.heart_rate >= 120) st = 'status-danger';
        else if(d.heart_rate >= 100) st = 'status-warning';
        wrap.className = 'hr-pixel ' + st;
        status = st;
      }else{
        wrap.className = 'hr-pixel disconnected';
        bpm.innerText = 'OFF';
        maxBpm.innerText = '--';
        status = 'disconnected';
      }
    }catch(err){}
  };
  socket.onclose = () => {
    wrap.className = 'hr-pixel disconnected';
    bpm.innerText = 'LOST';
    setTimeout(conn, 5000);
  };
}
setInterval(()=>{
  if(status !== 'disconnected' && Date.now() - lastTime > 4000){
    wrap.className = 'hr-pixel disconnected';
    bpm.innerText = 'WAIT';
    status = 'disconnected';
  }
},1000);
conn();
</script>
</body>
</html>
