<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 极高透圆角玻璃胶囊 */
        .container { 
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 24px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-family: system-ui, -apple-system, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* 隐藏在胶囊内部的隐性高透液体光晕层 */
        .container::before {
            content: ''; position: absolute; left: -50%; top: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, var(--fluid-glow, rgba(255,255,255,0.05)) 0%, transparent 60%);
            transition: background 0.5s ease;
            pointer-events: none;
        }
        
        /* 优雅的细体大字 */
        #bpm { 
            font-size: 38px; font-weight: 300; color: #ffffff; 
            line-height: 1; min-width: 65px; text-align: left;
            letter-spacing: -0.5px;
        }
        
        .capsule-meta { display: flex; flex-direction: column; margin-left: 14px; line-height: 1.1; position: relative; }
        .capsule-lbl { font-size: 7px; color: rgba(255, 255, 255, 0.3); font-weight: bold; letter-spacing: 0.5px; }
        #maxBpm { font-size: 15px; color: rgba(255, 255, 255, 0.7); font-weight: 600; margin-top: 1px; }
        
        /* 模拟危机时液体沸腾脉冲 */
        @keyframes fluid-pulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        /* 状态变色（纯透明雾化过渡） */
        .status-normal { --fluid-glow: rgba(255,255,255,0.05); }
        
        .status-warning { --fluid-glow: rgba(255, 165, 0, 0.15); border-color: rgba(255, 165, 0, 0.2); }
        .status-warning #bpm { color: #ffa500; font-weight: 400; }

        .status-danger { --fluid-glow: rgba(255, 0, 50, 0.3); border-color: rgba(255, 0, 50, 0.3); }
        .status-danger #bpm { color: #ff0033; font-weight: 400; }
        .status-danger::before { animation: fluid-pulse 0.6s infinite alternate ease-in-out; }

        /* 系统断开（无光全透） */
        .disconnected { background: transparent !important; border-color: rgba(255,255,255,0.02) !important; backdrop-filter: none !important; }
        .disconnected::before { background: transparent !important; animation: none !important; }
        .disconnected #bpm { color: rgba(255,255,255,0.07); font-size: 26px; font-weight: 300; }
        .disconnected #maxBpm { color: rgba(255,255,255,0.04); }
        .disconnected .capsule-lbl { color: rgba(255,255,255,0.02); }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="bpm">--</span>
        <div class="capsule-meta">
            <span class="capsule-lbl">MAX LOG</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
