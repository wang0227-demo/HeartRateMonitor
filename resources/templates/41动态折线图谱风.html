<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 几何不规则模块 */
        .container { 
            display: inline-flex;
            align-items: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: rgba(18, 19, 23, 0.95);
            padding: 12px 24px;
            border-left: 4px solid var(--accent-color, #007aff);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* 纯几何线条构成的数据分隔符 */
        .geo-divider {
            width: 2px;
            height: 35px;
            background: linear-gradient(to bottom, transparent, var(--accent-color, #007aff), transparent);
            margin: 0 20px;
        }
        
        /* 当前数值 */
        .bpm-wrap { display: flex; flex-direction: column; }
        .label { font-size: 9px; color: #535763; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 2px; }
        #bpm { 
            font-size: 36px; font-weight: 800; color: #ffffff; 
            line-height: 1; min-width: 65px;
        }
        
        /* 最高值样式 */
        .max-wrap { display: flex; flex-direction: column; }
        #maxBpm { font-size: 22px; font-weight: 700; color: #ffffff; opacity: 0.8; line-height: 1; }
        
        /* 慢速边框扩散动画 */
        @keyframes geo-pulse {
            0% { border-left-color: var(--accent-color); }
            50% { border-left-color: #ffffff; filter: drop-shadow(0 0 5px var(--accent-color)); }
            100% { border-left-color: var(--accent-color); }
        }

        /* 状态判定 */
        .status-normal { --accent-color: #007aff; }
        
        .status-warning { --accent-color: #ff9500; animation: geo-pulse 0.8s infinite ease-in-out; }
        .status-warning #bpm { color: #ff9500; }
        
        .status-danger { --accent-color: #ff3b30; animation: geo-pulse 0.3s infinite ease-in-out; }
        .status-danger #bpm { color: #ff3b30; }

        /* 断开连接 */
        .disconnected { border-left-color: #333 !important; background: #111 !important; box-shadow: none !important; }
        .disconnected .geo-divider { background: #222 !important; }
        .disconnected #bpm { color: #444; font-size: 24px; }
        .disconnected #maxBpm { color: #333; }
        .disconnected .label { color: #2a2a2a; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <div class="bpm-wrap">
            <span class="label">Live HR</span>
            <span id="bpm">--</span>
        </div>
        <div class="geo-divider"></div>
        <div class="max-wrap">
            <span class="label">Peak</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
