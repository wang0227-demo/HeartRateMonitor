<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 极致简约悬浮风，无背景 */
        .container { 
            display: flex; align-items: center; 
            font-family: 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif; /* 现代纤细字体 */
            font-weight: 200; /* 极细字重 */
            color: #00ffff; /* 电光蓝 */
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(0,255,255,0.4);
        }

        /* 细线呼吸动效 */
        @keyframes subtle-pulse { 
            0%, 100% { transform: scale(1); opacity: 0.8; } 
            50% { transform: scale(1.15); opacity: 1; } 
        }

        .heart { margin-right: 15px; font-size: 35px; display: inline-block; animation: none !important; color: #00ffff; opacity: 0.8; }
        
        /* 细体数字 */
        #bpm { font-size: 80px; min-width: 90px; text-align: center; font-weight: 200; letter-spacing: -2px; }
        
        /* 细分割线连接 Max 信息 */
        .max-info { 
            display: flex; flex-direction: column; align-items: flex-start; margin-left: 15px; 
            border-left: 1px solid #00ffff; padding-left: 15px; opacity: 0.6;
        }
        .max-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
        #maxBpm { font-size: 24px; font-weight: 400; }

        /* 状态控制：只改变细线和字体的颜色 */
        .status-normal .heart::before { content: '💓 '; } /* 使用薄线图标 */
        .status-normal .heart { animation: subtle-pulse 1s infinite ease-in-out; }

        .status-warning { color: #ffff00; }
        .status-warning .max-info { border-color: #ffff00; }
        .status-warning .heart { color: #ffff00; animation: subtle-pulse 0.5s infinite ease-in-out; }

        .status-danger { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        .status-danger .max-info { border-color: #ff0055; }
        .status-danger .heart { color: #ff0055; animation: subtle-pulse 0.2s infinite ease-in-out; }

        .disconnected { opacity: 0.3; }
        .disconnected .heart::before { content: '🤍 '; } /* 离线时使用空心图标 */
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart"></span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">MAX</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("---"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '---';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("WAIT"); }, 1000);
        connect();
    </script>
</body>
</html>
