<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 蒸汽波幻觉容器 */
        .container { 
            display: inline-flex; 
            align-items: center; 
            font-family: 'Impact', 'Arial Black', sans-serif; 
            background: linear-gradient(135deg, #2b1055, #7597de);
            padding: 15px 30px;
            border-radius: 0px; /* 纯直角 */
            border: 3px solid #00f0ff;
            box-shadow: 8px 8px 0px #ff007f;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .heart { margin-right: 20px; font-size: 38px; }
        
        /* RGB 分裂感主文字 */
        #bpm { 
            font-size: 60px; 
            font-weight: 900; 
            color: #fff; 
            text-shadow: -3px -3px 0 #00f0ff, 3px 3px 0 #ff007f;
            letter-spacing: 2px;
            min-width: 90px;
            text-align: center;
        }
        
        /* 别致的斜角最高值小标签 */
        .max-info { 
            margin-left: 25px; 
            background: #ff007f; 
            color: #fff;
            padding: 4px 10px;
            transform: skewX(-10deg);
            box-shadow: 3px 3px 0px #00f0ff;
        }
        .max-label { font-size: 10px; font-family: sans-serif; font-weight: bold; display: block; letter-spacing: 1px; }
        #maxBpm { font-size: 20px; font-weight: bold; display: block; text-align: center; }
        
        /* 蒸汽波专属极度摇晃与色差动画 */
        @keyframes v-beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15) rotate(-2deg); } }
        @keyframes v-glitch {
            0% { transform: translate(0) skew(0deg); text-shadow: -3px -3px 0 #00f0ff, 3px 3px 0 #ff007f; }
            20% { transform: translate(-3px, 2px) skew(-5deg); text-shadow: 3px -3px 0 #00f0ff, -3px 3px 0 #ff007f; }
            40% { transform: translate(3px, -2px) skew(5deg); }
            60% { transform: translate(-2px, -2px) skew(0deg); text-shadow: -1px -3px 0 #00f0ff, 3px 1px 0 #ff007f; }
            80% { transform: translate(2px, 2px) skew(2deg); }
            100% { transform: translate(0) skew(0deg); }
        }
        
        /* 状态控制 */
        .status-normal .heart { animation: v-beat 0.9s infinite ease-in-out; }
        
        .status-warning { border-color: #ffaa00; box-shadow: 8px 8px 0px #00ffcc; }
        .status-warning .heart { animation: v-beat 0.5s infinite ease-in-out; }
        
        .status-danger { animation: v-glitch 0.2s infinite linear; border-color: #ff007f; box-shadow: 8px 8px 0px #00f0ff; }
        .status-danger .heart { animation: v-beat 0.2s infinite linear; }
        .status-danger #bpm { text-shadow: -5px -2px 0 #ff007f, 5px 2px 0 #00f0ff; }

        /* 断开连接（灰色雕像风） */
        .disconnected { background: #222 !important; border-color: #555 !important; box-shadow: 8px 8px 0px #333 !important; }
        .disconnected .heart { filter: grayscale(1); opacity: 0.2; }
        .disconnected #bpm { text-shadow: none !important; color: #555; }
        .disconnected .max-info { background: #444; box-shadow: 3px 3px 0px #222; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">🔮</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">PEAK</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
