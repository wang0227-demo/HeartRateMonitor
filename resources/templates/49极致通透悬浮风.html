<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 10px; }
        
        /* 完全无背景、无边框的通透容器 */
        .container { 
            display: inline-flex; 
            align-items: center; 
            font-family: 'Arial Black', -apple-system, sans-serif; 
            background: transparent;
            padding: 0;
            margin: 0;
            user-select: none;
        }
        
        /* 极致轻量的心形 */
        .heart { 
            margin-right: 15px; 
            font-size: 48px; 
            display: inline-block; 
            will-change: transform, filter;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        
        /* 主数字：靠超强文字阴影保证在任何游戏背景下都清晰可见 */
        #bpm { 
            font-size: 72px; 
            font-weight: 900; 
            color: #ffffff; 
            line-height: 1;
            min-width: 110px; 
            text-align: center;
            text-shadow: 0 4px 12px rgba(0,0,0,0.8), 0 1px 2px rgba(0,0,0,0.9);
        }
        
        /* 侧边最高值紧凑排布 */
        .max-info { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            margin-left: 15px; 
            line-height: 1.1;
        }
        .max-label { 
            font-size: 11px; 
            color: rgba(255, 255, 255, 0.4); 
            text-transform: uppercase; 
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        #maxBpm { 
            font-size: 24px; 
            font-weight: bold; 
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        
        /* 高级纯文字发光呼吸 */
        @keyframes text-pulse { 
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px var(--glow-color)); } 
            50% { transform: scale(1.1); filter: drop-shadow(0 0 20px var(--glow-color)); } 
        }

        /* 状态变色 */
        .status-normal { --glow-color: rgba(0, 255, 150, 0.6); }
        .status-normal .heart { animation: text-pulse 0.9s infinite ease-in-out; color: #00ff96; }
        
        .status-warning { --glow-color: rgba(255, 170, 0, 0.8); }
        .status-warning .heart { animation: text-pulse 0.5s infinite ease-in-out; color: #ffaa00; }
        .status-warning #bpm { color: #ffaa00; }
        
        .status-danger { --glow-color: rgba(255, 0, 80, 1); }
        .status-danger .heart { animation: text-pulse 0.25s infinite linear; color: #ff0050; }
        .status-danger #bpm { color: #ff0050; text-shadow: 0 0 15px rgba(255,0,80,0.6), 0 4px 12px rgba(0,0,0,0.8); }

        /* 断开连接 */
        .disconnected .heart { animation: none !important; color: #555 !important; filter: grayscale(1); opacity: 0.3; }
        .disconnected #bpm { color: #444; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 48px; }
        .disconnected #maxBpm { color: #444; text-shadow: none; }
        .disconnected .max-label { color: #222; text-shadow: none; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">♥</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">PEAK</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
