<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        /* 苹果/现代极简字体栈，数字采用极细字重 */
        .container { 
            display: flex; align-items: center; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: rgba(15, 15, 15, 0.5); /* 半透明黑底 */
            backdrop-filter: blur(10px); /* 毛玻璃模糊效果 */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 12px 25px;
            transition: all 0.5s ease;
        }
        .heart { margin-right: 18px; font-size: 38px; display: inline-block; }
        #bpm { font-size: 75px; min-width: 90px; text-align: center; font-weight: 200; /* 极细字重 */ }
        
        .max-info { display: flex; flex-direction: column; align-items: flex-start; margin-left: 20px; }
        .max-label { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
        #maxBpm { font-size: 22px; color: rgba(255,255,255,0.9); font-weight: 400; }

        /* 优雅平滑的呼吸 */
        @keyframes smooth-pulse { 
            0% { transform: scale(1); opacity: 0.8; } 
            50% { transform: scale(1.15); opacity: 1; } 
            100% { transform: scale(1); opacity: 0.8; } 
        }

        /* 整体字色保持纯净白，仅用图标和细微发光提示状态 */
        .status-normal { color: #ffffff; box-shadow: 0 4px 15px rgba(0, 255, 128, 0.1); }
        .status-normal .heart { animation: smooth-pulse 1s infinite ease-in-out; text-shadow: 0 0 10px #00ff80; }

        .status-warning { color: #ffffff; box-shadow: 0 4px 15px rgba(255, 170, 0, 0.15); }
        .status-warning .heart { animation: smooth-pulse 0.6s infinite ease-in-out; text-shadow: 0 0 12px #ffaa00; }

        .status-danger { color: #ffcccc; box-shadow: 0 4px 20px rgba(255, 0, 0, 0.3); border-color: rgba(255, 0, 0, 0.3); }
        .status-danger .heart { animation: smooth-pulse 0.3s infinite ease-in-out; text-shadow: 0 0 15px #ff0000; }

        .disconnected { color: rgba(255,255,255,0.3) !important; background: rgba(15, 15, 15, 0.2); }
        .disconnected .heart { animation: none !important; filter: grayscale(1) opacity(0.3); }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">🤍</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">Peak HR</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';
        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            
                            // 根据状态切换空心/实心心形
                            const heartIcon = document.getElementById('heartIcon');
                            if (targetStatus === 'status-danger') heartIcon.innerText = '❤️';
                            else if (targetStatus === 'status-warning') heartIcon.innerText = '💛';
                            else heartIcon.innerText = '💚';
                            
                            currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("OFF"); }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text; maxEl.innerText = '--';
                document.getElementById('heartIcon').innerText = '🤍';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
