<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 黄铜/红铜复古金属感 */
        .container { 
            display: flex; align-items: center; 
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #a07844 0%, #5c4328 50%, #3d2b19 100%);
            border: 4px solid #d4af37; /* 金色外圈 */
            border-radius: 15px; padding: 10px 25px;
            /* 模拟金属扣件和内凹发光 */
            box-shadow: 0 8px 15px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.6);
            position: relative;
            transition: all 0.4s;
        }

        /* 四角模拟铆钉 */
        .container::before {
            content: '•       •'; position: absolute; top: 2px; left: 8px; right: 8px;
            color: #3d2b19; font-size: 14px; word-spacing: 120px; opacity: 0.6;
        }

        /* 齿轮无限旋转动效 */
        @keyframes gear-spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        /* 机械结构整体气阀抖动 */
        @keyframes valve-shake {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-2px) rotate(0.5deg); }
        }

        .heart { margin-right: 18px; font-size: 45px; display: inline-block; color: #d4af37; transform-origin: center; }
        
        /* 复古压力表数值 */
        #bpm { 
            font-size: 70px; min-width: 95px; text-align: center; font-weight: bold; 
            color: #ffebad; text-shadow: 2px 2px 3px rgba(0,0,0,0.8);
        }
        
        .max-info { display: flex; flex-direction: column; align-items: center; margin-left: 20px; background: rgba(0,0,0,0.4); padding: 3px 10px; border: 1px solid #5c4328; border-radius: 4px; }
        .max-label { font-size: 10px; color: #a07844; font-weight: bold; text-transform: uppercase; }
        #maxBpm { font-size: 22px; color: #ffcc66; font-weight: bold; }

        /* 不同心率下的齿轮转速（核心精髓所在） */
        /* 正常状态：齿轮缓慢旋转 */
        .status-normal .heart { animation: gear-spin 4s infinite linear; }
        
        /* 警告状态：表盘变暗红铜，齿轮转速加快 */
        .status-warning { background: linear-gradient(135deg, #8b4513 0%, #4a2306 100%); border-color: #cd7f32; }
        .status-warning .heart { animation: gear-spin 1.2s infinite linear; color: #cd7f32; }
        .status-warning #bpm { color: #ffcc99; }

        /* 危险状态：气压爆表！锅炉红热，齿轮疯狂超速旋转，整体框架剧烈震颤 */
        .status-danger { 
            background: linear-gradient(135deg, #b22222 0%, #4a0000 100%); border-color: #ff4500; 
            animation: valve-shake 0.1s infinite;
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.5), inset 0 0 20px rgba(0,0,0,0.8);
        }
        .status-danger .heart { animation: gear-spin 0.25s infinite linear; color: #ff4500; filter: drop-shadow(0 0 5px #ff4500); }
        .status-danger #bpm { color: #fffff0; text-shadow: 0 0 10px #ff4500; }
        .status-danger #maxBpm { color: #ff4500; }

        .disconnected { filter: grayscale(1) brightness(0.6); box-shadow: none; }
        .disconnected .heart { animation: none !important; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">⚙️</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">BOOST</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("OFF"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("STOP"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '000';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("IDLE"); }, 1000);
        connect();
    </script>
</body>
</html>
