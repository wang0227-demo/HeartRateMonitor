<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 报纸剪贴的错乱感 */
        .container { 
            display: flex; align-items: center; 
            font-family: 'Courier New', 'Impact', 'Times New Roman', sans-serif;
            background: #fff;
            padding: 10px 20px;
            /* 模拟不规则的纸张边缘 */
            clip-path: polygon(2% 0, 98% 3%, 100% 96%, 3% 100%);
            box-shadow: 5px 5px 0 rgba(0,0,0,0.5);
            transform: rotate(2deg);
            transition: all 0.2s;
        }

        /* 神经质抖动 */
        @keyframes psycho-shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-2px, 3px) rotate(-3deg); }
            40% { transform: translate(3px, -2px) rotate(2deg); }
            60% { transform: translate(-3px, -1px) rotate(-1deg); }
            80% { transform: translate(2px, 2px) rotate(3deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        
        /* 图标是写实的器官 */
        .heart { margin-right: 15px; font-size: 50px; display: inline-block; filter: drop-shadow(2px 2px 0 #000); transform-origin: center; }
        
        /* BPM 字体极度浮夸，像剪下来的大标题 */
        #bpm { 
            font-size: 85px; min-width: 100px; text-align: center; 
            font-family: 'Impact', sans-serif;
            background: #000; color: #fff; 
            padding: 0 10px; transform: rotate(-4deg);
            box-shadow: 2px 2px 0px #555;
        }
        
        .max-info { display: flex; flex-direction: column; align-items: center; margin-left: 20px; background: #ffffaa; padding: 5px; transform: rotate(5deg); border: 1px solid #000; }
        .max-label { font-size: 14px; color: #000; font-family: 'Courier New', monospace; font-weight: bold; }
        #maxBpm { font-size: 30px; color: #c00; font-family: 'Times New Roman', serif; font-style: italic; font-weight: bold; }

        /* 状态改变时背景色和排版更加扭曲 */
        .status-normal .heart { animation: psycho-shake 1.5s infinite steps(2); }

        .status-warning { background: #ffcccc; clip-path: polygon(0 2%, 100% 0, 97% 100%, 2% 96%); }
        .status-warning #bpm { background: #c00; color: #fff; transform: rotate(3deg); }
        .status-warning .heart { animation: psycho-shake 0.5s infinite steps(3); filter: invert(1); }

        /* 极度危险：疯狂掉帧感 */
        .status-danger { background: #000; clip-path: polygon(1% 1%, 99% 4%, 96% 98%, 4% 95%); animation: psycho-shake 0.1s infinite; }
        .status-danger #bpm { background: #fff; color: #000; font-size: 95px; }
        .status-danger .max-info { background: #f00; color: #fff; }
        .status-danger .max-label { color: #fff; }
        .status-danger #maxBpm { color: #000; }
        .status-danger .heart { animation: psycho-shake 0.1s infinite; font-size: 60px; filter: grayscale(1) contrast(5); }

        .disconnected { opacity: 0.5; background: #eee; }
        .disconnected .heart { animation: none !important; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">🫀</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">P E A K</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("DEAD"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("VOID"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '??';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("SHHH"); }, 1000);
        connect();
    </script>
</body>
</html>
