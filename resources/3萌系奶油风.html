<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        /* 采用圆润风格的无衬线字体 */
        .container { display: flex; align-items: center; font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', 'SimHei', sans-serif; transition: all 0.4s ease-in-out; }
        .heart { will-change: transform; margin-right: 20px; font-size: 50px; display: inline-block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        #bpm { font-size: 65px; min-width: 85px; text-align: center; font-weight: bold; }
        
        /* 按钮化的最高心率小胶囊 */
        .max-info { display: flex; flex-direction: column; align-items: center; margin-left: 25px; background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .max-label { font-size: 11px; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; margin-bottom: 2px; font-weight: bold; }
        #maxBpm { font-size: 24px; font-weight: bold; }

        /* 软绵绵的Q弹果冻动效（上下挤压微调） */
        @keyframes jelly { 
            0% { transform: scale(1); } 
            30% { transform: scale(1.2, 0.85); } 
            50% { transform: scale(0.95, 1.15); } 
            85% { transform: scale(1.05, 0.95); } 
            100% { transform: scale(1); } 
        }

        /* 马卡龙配色：薄荷绿 -> 芝士黄 -> 蜜桃软红 */
        .status-normal { color: #a8ffb2; color: #7bf1a8; text-shadow: 0 4px 10px rgba(123,241,168,0.4); }
        .status-normal .heart { animation: jelly 1.0s infinite ease-in-out; }

        .status-warning { color: #fcd34d; text-shadow: 0 4px 10px rgba(252,211,77,0.4); }
        .status-warning .heart { animation: jelly 0.6s infinite ease-in-out; }

        .status-danger { color: #ff8b8b; text-shadow: 0 4px 12px rgba(255,139,139,0.5); }
        .status-danger .heart { animation: jelly 0.38s infinite ease-in-out; }

        .disconnected { color: rgba(255,255,255,0.3) !important; text-shadow: none !important; }
        .disconnected .max-info { background: rgba(255,255,255,0.05); box-shadow: none; }
        .disconnected .heart { animation: none !important; filter: grayscale(1) opacity(0.4); }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">❤️</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">Peak</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { 
                updateStateToDisconnected("LOST"); 
                setTimeout(connect, 5000); 
            };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
