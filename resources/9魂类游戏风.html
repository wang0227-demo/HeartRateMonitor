<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        /* 使用衬线字体（Serif），带有古典宗教感 */
        .container { 
            display: flex; align-items: center; 
            font-family: 'Times New Roman', Times, serif; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            transition: all 0.5s ease;
        }
        .heart { margin-right: 15px; font-size: 50px; display: inline-block; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); transform-origin: bottom; }
        
        #bpm { font-size: 80px; min-width: 90px; text-align: center; font-weight: normal; }
        
        .max-info { display: flex; flex-direction: column; align-items: center; margin-left: 20px; border-top: 1px solid; border-bottom: 1px solid; padding: 5px 0; }
        .max-label { font-size: 12px; letter-spacing: 3px; font-weight: bold; }
        #maxBpm { font-size: 28px; }

        /* 液体般的沉重搏动 */
        @keyframes blood-pulse { 
            0% { transform: scale(1, 1); filter: brightness(1); } 
            30% { transform: scale(1.1, 0.9); filter: brightness(1.2); } 
            50% { transform: scale(0.95, 1.05); } 
            100% { transform: scale(1, 1); filter: brightness(1); } 
        }

        /* 颜色：暗红 -> 污浊黄 -> 鲜血亮红 */
        /* Normal状态：非常暗的沉寂血色 */
        .status-normal { color: #8a0303; border-color: rgba(138, 3, 3, 0.4); text-shadow: 0 0 10px rgba(138, 3, 3, 0.5); }
        .status-normal .max-label { color: #a37c4e; /* 古铜色 */ }
        .status-normal .heart { animation: blood-pulse 1.2s infinite ease-in-out; }

        /* Warning状态：黄铜色/腐朽感 */
        .status-warning { color: #c4962d; border-color: rgba(196, 150, 45, 0.4); text-shadow: 0 0 15px rgba(196, 150, 45, 0.5); }
        .status-warning .max-label { color: #8a0303; }
        .status-warning .heart { animation: blood-pulse 0.6s infinite ease-in-out; }

        /* Danger状态：刺目的亮鲜血色，伴随微弱不规则震颤 */
        @keyframes souls-fear {
            0% { transform: translateX(0); }
            25% { transform: translateX(-1px); }
            75% { transform: translateX(1px); }
            100% { transform: translateX(0); }
        }
        .status-danger { color: #ff0000; border-color: rgba(255, 0, 0, 0.6); text-shadow: 0 0 20px #ff0000, 0 0 40px #aa0000; animation: souls-fear 0.1s infinite; }
        .status-danger .max-label { color: #ffaa00; }
        .status-danger .heart { animation: blood-pulse 0.3s infinite ease-in-out; filter: hue-rotate(-10deg) brightness(1.5); }

        .disconnected { color: #222 !important; border-color: #111 !important; text-shadow: none !important; }
        .disconnected .max-label { color: #333 !important; }
        .disconnected .heart { animation: none !important; filter: grayscale(1) brightness(0.2); }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">🩸</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">PEAK</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("OFF"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '--';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("WAIT"); }, 1000);
        connect();
    </script>
</body>
</html>
