<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 纯街机连击悬浮风 */
        .container { 
            display: flex; align-items: center; 
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-style: italic; /* 倾斜极具速度感 */
            color: #ffcc00; /* 暴击金黄 */
            text-shadow: 4px 4px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000; /* 四向重黑描边 */
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 连击计数器经典的震裂反弹动画 */
        @keyframes combo-hit {
            0% { transform: scale(1) rotate(-5deg); }
            20% { transform: scale(1.3) rotate(-8deg); filter: brightness(1.3); }
            100% { transform: scale(1) rotate(-5deg); }
        }

        .heart { display: none; } /* 格斗连击不需要心型 */
        
        /* 巨大连击数 */
        #bpm { 
            font-size: 95px; min-width: 100px; text-align: center; font-weight: 900;
            transform: rotate(-5deg); display: inline-block;
            animation: combo-hit 1s infinite ease-in-out;
        }
        /* 利用伪元素在数字后加上 COMBO 单词，格斗味极其纯正 */
        #bpm::after { content: ' COMBO'; font-size: 20px; color: #fff; text-shadow: 3px 3px 0 #000; position: relative; bottom: 35px; left: 5px; }
        
        .max-info { 
            display: flex; flex-direction: column; align-items: flex-start; margin-left: 25px; 
            transform: rotate(-3deg);
        }
        .max-label { font-size: 12px; color: #ff5500; font-weight: bold; letter-spacing: 1px; }
        #maxBpm { font-size: 28px; color: #fff; text-shadow: 3px 3px 0px #000; }

        /* 状态改变：金黄连击 -> 橙红高潮连击 -> 猩红极限破防连击 */
        .status-normal #bpm { animation: combo-hit 1.2s infinite ease-in-out; }

        .status-warning { color: #ff6600; }
        .status-warning #bpm { animation: combo-hit 0.5s infinite ease-in-out; }

        /* 极度危险：暴击爆表！触发高频连击晃动 */
        @keyframes ultra-rage {
            0% { transform: translate(1px, 1px) scale(1.1) rotate(-6deg); }
            50% { transform: translate(-2px, -1px) scale(1.15) rotate(-4deg); }
            100% { transform: translate(1px, -2px) scale(1.1) rotate(-6deg); }
        }
        .status-danger { color: #ff0033; }
        .status-danger #bpm { animation: ultra-rage 0.1s infinite !important; }
        .status-danger #maxBpm { color: #ff0033; }

        .disconnected { opacity: 0.2; }
        .disconnected #bpm { animation: none !important; color: #ccc; text-shadow: 3px 3px 0 #000; }
        .disconnected #bpm::after { display: none; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart"></span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">HIT MAX</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("00"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("??"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '---';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("00"); }, 1000);
        connect();
    </script>
</body>
</html>
