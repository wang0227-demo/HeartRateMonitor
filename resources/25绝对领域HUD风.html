<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 纯悬浮全息投影，无背景 */
        .container { 
            display: flex; align-items: center; 
            font-family: 'Arial Black', Gadget, sans-serif;
            color: #ff5500; /* 经典EVA警戒橙 */
            text-shadow: 0 0 8px rgba(255, 85, 0, 0.6);
            transition: all 0.2s ease;
        }

        /* 准星锁定呼吸动画 */
        @keyframes hud-bracket { 
            0%, 100% { transform: scale(1); opacity: 0.8; } 
            50% { transform: scale(1.08); opacity: 1; } 
        }

        /* 用伪元素做尖锐的机甲十字准星 */
        .heart { 
            margin-right: 10px; font-size: 28px; font-weight: 900;
            letter-spacing: -1px; position: relative;
        }
        .heart::before { content: 'TARGET'; font-size: 10px; display: block; line-height: 1; opacity: 0.7; }
        
        /* 被方括号锁定的数值 */
        .bpm-wrapper { display: flex; align-items: center; animation: hud-bracket 1s infinite ease-in-out; }
        .bpm-wrapper::before { content: '['; font-size: 70px; font-weight: 100; margin-right: 5px; }
        .bpm-wrapper::after { content: ']'; font-size: 70px; font-weight: 100; margin-left: 5px; }
        
        #bpm { font-size: 75px; min-width: 95px; text-align: center; font-weight: 900; }
        
        .max-info { display: flex; flex-direction: column; margin-left: 15px; font-size: 11px; font-family: monospace; }
        .max-label { opacity: 0.6; letter-spacing: 1px; }
        #maxBpm { font-size: 20px; font-weight: bold; }

        /* 动态增加的危机文本 */
        .warning-text { display: none; font-size: 14px; font-weight: 900; margin-left: 15px; letter-spacing: 1px; animation: hud-bracket 0.3s infinite; }

        /* 状态颜色突变：橙色 -> 黄色 -> 觉醒血红 */
        .status-normal { color: #ff5500; text-shadow: 0 0 8px rgba(255, 85, 0, 0.6); }
        
        .status-warning { color: #ffcc00; text-shadow: 0 0 8px rgba(255, 204, 0, 0.6); }
        .status-warning .bpm-wrapper { animation-duration: 0.5s; }

        .status-danger { color: #ff0033; text-shadow: 0 0 15px #ff0033; }
        .status-danger .bpm-wrapper { animation: hud-bracket 0.2s infinite alternate; }
        .status-danger .warning-text { display: inline-block; }

        .disconnected { opacity: 0.2; color: #fff !important; text-shadow: none !important; }
        .disconnected .bpm-wrapper { animation: none !important; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">❖</span>
        <div class="bpm-wrapper">
            <span id="bpm">--</span>
        </div>
        <div class="max-info">
            <span class="max-label">LIMIT_MAX</span>
            <span id="maxBpm">--</span>
        </div>
        <span class="warning-text">&lt;&lt; CRITICAL &gt;&gt;</span>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("---"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '---';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("STBY"); }, 1000);
        connect();
    </script>
</body>
</html>
