<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        .container { display: flex; align-items: baseline; font-family: 'Impact', 'Arial Black', sans-serif; transition: all 0.2s; }
        .heart { margin-right: 15px; font-size: 40px; transform-origin: bottom; }
        #bpm { font-size: 85px; min-width: 110px; font-style: italic; text-align: center; }
        
        .max-info { display: flex; flex-direction: column; margin-left: 20px; font-family: Arial, sans-serif; }
        .max-label { font-size: 11px; color: rgba(255,255,255,0.3); font-weight: bold; letter-spacing: 1px; }
        #maxBpm { font-size: 30px; opacity: 0.6; }

        /* 模仿监护仪的心电跳动：突然纵向拉高，然后迅速恢复原始状态 */
        @keyframes ECG-beat { 
            0% { transform: scaleY(1); } 
            10% { transform: scaleY(1.4) scaleX(0.9); } 
            20% { transform: scaleY(0.8); } 
            30% { transform: scaleY(1); } 
            100% { transform: scaleY(1); } 
        }
        /* 危险状态下的急促红光闪烁 */
        @keyframes alarm-flash { 
            0%, 100% { opacity: 1; filter: brightness(1); } 
            50% { opacity: 0.3; filter: brightness(1.6); } 
        }
        /* 微小高频抖动（濒死感） */
        @keyframes flatline { 
            0% { transform: translate(1px, 1px) } 
            50% { transform: translate(-1px, -1px) } 
        }

        /* 医用荧光绿 -> 警告橙 -> 危险血红 */
        .status-normal { color: #00ff33; filter: drop-shadow(0 0 8px #00ff33); }
        .status-normal .heart { animation: ECG-beat 0.9s infinite; }

        .status-warning { color: #ff6600; filter: drop-shadow(0 0 10px #ff6600); }
        .status-warning .heart { animation: ECG-beat 0.5s infinite; }

        .status-danger { color: #ff0033; filter: drop-shadow(0 0 15px #ff0033); animation: alarm-flash 0.3s infinite; }
        .status-danger .heart { animation: ECG-beat 0.25s infinite; }
        .status-danger #bpm { animation: flatline 0.05s infinite; }

        .disconnected { color: #222 !important; filter: none !important; }
        .disconnected .heart { animation: none !important; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">📊</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">PEAK</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { 
                updateStateToDisconnected("LOST"); 
                setTimeout(connect, 5000); 
            };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
