<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        /* 战术风等宽字体 */
        .container { 
            display: flex; align-items: center; 
            font-family: 'Consolas', 'Courier New', monospace; font-weight: bold;
            background: rgba(0, 20, 30, 0.6);
            border: 2px solid;
            padding: 10px 20px;
            position: relative;
            transition: all 0.3s;
        }
        /* HUD 边角装饰 */
        .container::before, .container::after {
            content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid transparent;
        }
        .container::before { top: -2px; left: -2px; border-top-color: inherit; border-left-color: inherit; }
        .container::after { bottom: -2px; right: -2px; border-bottom-color: inherit; border-right-color: inherit; }

        .heart { margin-right: 15px; font-size: 35px; display: inline-block; }
        
        #bpm { font-size: 65px; min-width: 90px; text-align: center; }
        /* 为 BPM 加上括号，增加仪表盘感 */
        #bpm::before { content: '['; margin-right: 5px; opacity: 0.5; }
        #bpm::after { content: ']'; margin-left: 5px; opacity: 0.5; }

        .max-info { display: flex; flex-direction: column; align-items: flex-end; margin-left: 20px; border-left: 1px dashed; padding-left: 15px; }
        .max-label { font-size: 12px; letter-spacing: 2px; }
        #maxBpm { font-size: 24px; }

        /* 雷达扫描/心跳动效 */
        @keyframes radar-ping { 
            0% { transform: scale(0.8); opacity: 1; } 
            100% { transform: scale(1.5); opacity: 0; } 
        }
        .heart { position: relative; }
        .status-normal .heart::after, .status-warning .heart::after, .status-danger .heart::after {
            content: '◎'; position: absolute; left: 0; top: 0;
            animation: radar-ping 1s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        /* 战术颜色：全息蓝 -> 警示琥珀 -> 危机红 */
        .status-normal { color: #00e5ff; border-color: rgba(0, 229, 255, 0.3); text-shadow: 0 0 5px #00e5ff; }
        .status-warning { color: #ffab00; border-color: rgba(255, 171, 0, 0.3); text-shadow: 0 0 5px #ffab00; }
        .status-danger { color: #ff1744; border-color: rgba(255, 23, 68, 0.5); text-shadow: 0 0 10px #ff1744; }
        
        /* 危险时边框剧烈闪烁 */
        @keyframes hud-alert { 0%, 100% { border-color: rgba(255, 23, 68, 0.8); } 50% { border-color: rgba(255, 23, 68, 0.1); } }
        .status-danger { animation: hud-alert 0.3s infinite; }
        .status-danger .heart::after { animation: radar-ping 0.3s infinite; }

        .disconnected { color: #003344 !important; border-color: #002233 !important; text-shadow: none !important; }
        .disconnected .heart::after { display: none; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">◎</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">MAX_HR</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';
        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }

                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("OFF"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text; maxEl.innerText = '--';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) { updateStateToDisconnected("WAIT"); }
        }, 1000);
        connect();
    </script>
</body>
</html>
