<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 纯正的代码终端风 */
        .container { 
            display: flex; align-items: baseline; 
            font-family: 'Consolas', 'Menlo', 'Monaco', 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.85); /* 深黑终端底色 */
            padding: 10px 20px;
            border-left: 5px solid #0f0; /* 左侧粗横杠 */
            transition: border-color 0.3s;
        }

        /* 用代码符替代心形图标 */
        .heart { margin-right: 15px; font-size: 30px; font-weight: normal; }
        
        #bpm { font-size: 70px; min-width: 100px; text-align: left; font-weight: bold; }
        
        /* 模拟光标闪烁效果 */
        .cursor { display: inline-block; width: 15px; height: 10px; margin-left: 5px; background-color: currentColor; }
        
        .max-info { display: flex; flex-direction: column; justify-content: flex-end; margin-left: 20px; font-size: 14px; opacity: 0.7; }
        .max-label { content: 'root@max:~#'; margin-bottom: 2px; }
        .max-label::before { content: 'max_val: '; }
        #maxBpm { font-size: 20px; }

        /* 终端光标闪烁动效，频率即心跳 */
        @keyframes terminal-blink { 
            0%, 49% { opacity: 1; } 
            50%, 100% { opacity: 0; } 
        }

        /* 骇客绿 -> 报错黄 -> 致命红 */
        .status-normal { color: #00ff00; border-left-color: #00ff00; text-shadow: 0 0 5px rgba(0,255,0,0.5); }
        .status-normal .cursor { animation: terminal-blink 0.8s infinite step-start; }

        .status-warning { color: #ffff00; border-left-color: #ffff00; text-shadow: 0 0 8px rgba(255,255,0,0.6); }
        .status-warning .cursor { animation: terminal-blink 0.4s infinite step-start; }

        .status-danger { color: #ff0000; border-left-color: #ff0000; text-shadow: 0 0 10px rgba(255,0,0,0.8); }
        .status-danger .cursor { animation: terminal-blink 0.15s infinite step-start; }
        
        /* 危险状态下整体偶尔产生代码漂移(Glitch) */
        @keyframes code-glitch {
            0%, 98% { transform: translateX(0); }
            99% { transform: translateX(-3px) skewX(10deg); }
            100% { transform: translateX(2px); }
        }
        .status-danger { animation: code-glitch 2s infinite; }

        .disconnected { color: #555 !important; border-left-color: #333 !important; text-shadow: none !important; }
        .disconnected .cursor { animation: none !important; opacity: 1; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">sys.BPM></span>
        <span id="bpm">--</span>
        <span class="cursor"></span>
        
        <div class="max-info">
            <span class="max-label"></span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("ERR"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("LOST"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = 'null';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("WAIT"); }, 1000);
        connect();
    </script>
</body>
</html>
