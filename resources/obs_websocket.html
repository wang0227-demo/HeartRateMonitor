<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* CSS 部分保持你最新版的精美样式不变 */
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        .container { display: flex; align-items: center; font-family: 'Arial Black', sans-serif; transition: all 0.3s ease; }
        .heart { will-change: transform, filter; margin-right: 35px; font-size: 55px; display: inline-block; filter: drop-shadow(0 0 5px rgba(255,0,0,0.3)); }
        #bpm { font-size: 72px; min-width: 90px; text-align: center; }
        .max-info { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-left: 30px; line-height: 1.0; }
        .max-label { font-size: 14px; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; font-family: 'Arial', sans-serif; font-weight: bold; margin-bottom: 4px; }
        #maxBpm { font-size: 32px; color: rgba(255, 255, 255, 0.8); }
        @keyframes beat { 0% { transform: scale(1); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }
        .status-normal { color: #00ff88; text-shadow: 0 0 15px rgba(0, 255, 136, 0.6); }
        .status-normal .heart { animation: beat 0.8s infinite cubic-bezier(0.215, 0.61, 0.355, 1); }
        .status-warning { color: #ffaa00; text-shadow: 0 0 20px rgba(255, 170, 0, 0.8); }
        .status-warning .heart { animation: beat 0.5s infinite; }
        .status-danger { color: #ff0000; text-shadow: 0 0 25px #ff0000, 0 0 40px #ff0000; animation: screen-flash 0.4s infinite; }
        .status-danger .heart { animation: beat 0.25s infinite; }
        .status-danger #bpm { animation: shake 0.08s infinite; }
        @keyframes shake { 0% { transform: translate(3px, 3px); } 50% { transform: translate(-3px, -3px); } 100% { transform: translate(3px, -3px); } }
        @keyframes screen-flash { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        .disconnected { color: #555 !important; text-shadow: none !important; opacity: 0.5; }
        .disconnected .heart { animation: none !important; filter: grayscale(1); }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">❤️</span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">Peak</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null;
        let lastMessageTime = Date.now();
        
        // --- 性能优化：状态缓存变量 ---
        let currentStatus = 'disconnected'; 
        let currentHR = '--';
        let currentMax = '--';

        const bpmEl = document.getElementById('bpm');
        const maxEl = document.getElementById('maxBpm');
        const wrapper = document.getElementById('wrapper');

        function connect() {
            // 防止重复创建连接
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;

            socket = new WebSocket('ws://127.0.0.1:8001');

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    lastMessageTime = Date.now();

                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate;
                        const max = data.max_heart_rate || '--';

                        // 1. 只有数值变了才修改文字（减少重绘）
                        if (hr !== currentHR) {
                            bpmEl.innerText = hr;
                            currentHR = hr;
                        }
                        if (max !== currentMax) {
                            maxEl.innerText = max;
                            currentMax = max;
                        }

                        // 2. 状态分级判定
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';

                        // 3. 【核心优化】只有级别变了才切换 Class（避免每秒触发重排）
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus);
                            currentStatus = targetStatus;
                        }
                    } else {
                        updateStateToDisconnected("OFF");
                    }
                } catch (e) { console.error("Data error:", e); }
            };

            socket.onclose = () => { 
                updateStateToDisconnected("LOST"); 
                // 增加重连延迟保护
                setTimeout(connect, 5000); 
            };
            socket.onerror = () => { socket.close(); };
        }

        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected';
                bpmEl.innerText = text;
                maxEl.innerText = '--';
                currentStatus = 'disconnected';
                currentHR = '--';
                currentMax = '--';
            }
        }

        // 超时检测：如果 4 秒没收到数据，切换到等待状态
        setInterval(() => {
            if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) {
                updateStateToDisconnected("WAIT");
            }
        }, 1000);

        connect();
    </script>
</body>
</html>
