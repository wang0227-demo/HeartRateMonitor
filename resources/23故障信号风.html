<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 20px; }
        
        /* 故障信号悬浮风，无背景 */
        .container { 
            display: flex; align-items: baseline; 
            font-family: 'Courier New', monospace; font-weight: bold;
            color: #ff33ff; /* 洋红色 */
            transition: all 0.1s ease;
        }

        /* 视频撕裂/故障抖动动效 */
        @keyframes glitch { 
            0%, 100% { transform: translate(0, 0); opacity: 1; skewX(0deg); } 
            95% { transform: translate(0, 0); opacity: 1; skewX(0deg); } 
            96% { transform: translate(-3px, 2px) skewX(10deg); opacity: 0.8; } 
            97% { transform: translate(3px, -1px) skewX(-10deg); opacity: 0.9; } 
            98% { transform: translate(0, 0); opacity: 0.5; } 
        }

        /* 心型破碎图标动效 */
        @keyframes broken-beat { 
            0%, 100% { transform: scale(1) rotate(0deg); } 
            50% { transform: scale(1.3) rotate(-10deg); } 
        }

        .heart { margin-right: 15px; font-size: 35px; display: inline-block; animation: broken-beat 1s infinite steps(2); color: #ff33ff; }
        
        /* BPM 字体故障感 */
        #bpm { font-size: 80px; min-width: 90px; text-align: center; }
        #bpm::after { content: '_'; } /* 模拟终端光标 */
        
        .max-info { display: flex; flex-direction: column; align-items: flex-end; margin-left: 20px; opacity: 0.6; }
        .max-label { font-size: 11px; letter-spacing: 2px; }
        .max-label::before { content: 'MAX '; font-size: 9px; opacity: 0.5; }
        #maxBpm { font-size: 22px; font-weight: bold; }

        /* 状态微调：青色 -> 黄色 -> 红色故障 */
        .status-normal { color: #33ffff; animation: glitch 3s infinite steps(1); }
        .status-normal .heart { animation: broken-beat 0.9s infinite steps(2); color: #33ffff; }
        .status-normal #bpm { text-shadow: 2px 2px 0 rgba(0,255,255,0.3); }

        .status-warning { color: #ffff00; }
        .status-warning .heart { animation: broken-beat 0.5s infinite steps(2); color: #ffff00; }

        .status-danger { color: #ff0055; animation: glitch 0.2s infinite; text-shadow: 2px 2px 0 rgba(255,0,0,0.4); }
        .status-danger .heart { animation: broken-beat 0.25s infinite steps(2); color: #ff0055; font-size: 40px; }

        .disconnected { opacity: 0.3; }
        .disconnected .heart::before { content: '💔 '; }
    </style>
</head>
<body>
    <div id="wrapper" class="container disconnected">
        <span id="heartIcon" class="heart">💔 </span>
        <span id="bpm">--</span>
        <div class="max-info">
            <span class="max-label">HR-LIMIT</span>
            <span id="maxBpm">--</span>
        </div>
    </div>

    <script>
        let socket = null; let lastMessageTime = Date.now();
        let currentStatus = 'disconnected'; let currentHR = '--'; let currentMax = '--';
        const bpmEl = document.getElementById('bpm'); const maxEl = document.getElementById('maxBpm'); const wrapper = document.getElementById('wrapper');

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
            socket = new WebSocket('ws://127.0.0.1:8001');
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data); lastMessageTime = Date.now();
                    if (data.connected && data.heart_rate > 0) {
                        const hr = data.heart_rate; const max = data.max_heart_rate || '--';
                        if (hr !== currentHR) { bpmEl.innerText = hr; currentHR = hr; }
                        if (max !== currentMax) { maxEl.innerText = max; currentMax = max; }
                        let targetStatus = 'status-normal';
                        if (hr >= 120) targetStatus = 'status-danger';
                        else if (hr >= 100) targetStatus = 'status-warning';
                        if (currentStatus !== targetStatus) {
                            wrapper.classList.remove('disconnected', 'status-normal', 'status-warning', 'status-danger');
                            wrapper.classList.add(targetStatus); currentStatus = targetStatus;
                        }
                    } else { updateStateToDisconnected("OFF"); }
                } catch (e) { console.error("Data error:", e); }
            };
            socket.onclose = () => { updateStateToDisconnected("DISC"); setTimeout(connect, 5000); };
            socket.onerror = () => { socket.close(); };
        }
        function updateStateToDisconnected(text) {
            if (currentStatus !== 'disconnected') {
                wrapper.className = 'container disconnected'; bpmEl.innerText = text; maxEl.innerText = '---';
                currentStatus = 'disconnected'; currentHR = '--'; currentMax = '--';
            }
        }
        setInterval(() => { if (currentStatus !== 'disconnected' && (Date.now() - lastMessageTime > 4000)) updateStateToDisconnected("WAIT"); }, 1000);
        connect();
    </script>
</body>
</html>
